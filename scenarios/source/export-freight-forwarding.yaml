id: export-freight-forwarding
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们设计一个基于AI的解决方案，提升出口货运代理的运营效率并降低单证差错率"
    "en-US": "Please help us design an AI-based solution to improve our export freight forwarding efficiency and reduce documentation error rates"
  visibleContext:
    "zh-CN": "我们是一家出口货运代理公司，为客户安排海运和空运出口业务，覆盖订舱、报关、单证制作、跟踪和交付。当前业务高度依赖邮件、Excel 和人工跨系统录入，我们希望引入 AI 来减少人工操作、降低单证差错并提升货物可视化，同时满足海关与出口管制的合规要求。"
    "en-US": "We are an export freight forwarding company that arranges ocean and air exports for customers, covering booking, customs declaration, documentation, tracking, and delivery. Operations today rely heavily on email, Excel, and manual re-keying across fragmented systems. We want to introduce AI to reduce manual effort, lower documentation errors, and improve shipment visibility while meeting customs and export-control compliance."
  visibleConstraints:
    - "zh-CN": "必须与现有TMS（运输管理系统）和报关系统集成"
      "en-US": "Must integrate with the existing TMS and customs declaration system"
    - "zh-CN": "受控货物、制裁名单匹配和出口许可证相关单证必须保留人工复核"
      "en-US": "Documents involving controlled goods, sanctions screening, and export licenses must retain human review"
    - "zh-CN": "客户及舱单数据不得发送到境外的第三方大模型"
      "en-US": "Customer and manifest data must not be sent to offshore third-party LLMs"
    - "zh-CN": "八周试点期限，且不能影响现有在途货物的正常操作"
      "en-US": "Eight-week pilot timeline, and it must not disrupt live shipment operations"
  deliverables:
    - "zh-CN": "完整的货代运营优化方案设计文档"
      "en-US": "Complete freight forwarding operations optimization design document"
    - "zh-CN": "数据流图与系统架构图"
      "en-US": "Data flow diagram and system architecture diagram"
    - "zh-CN": "风险评估与缓解措施"
      "en-US": "Risk assessment and mitigation measures"
    - "zh-CN": "实施路线图与里程碑"
      "en-US": "Implementation roadmap and milestones"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解货代业务现状"
      "en-US": "You have a budget of 12 questions to understand the freight forwarding operation"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: operations-director
      role:
        "zh-CN": "货代运营总监"
        "en-US": "Operations Director"
      persona:
        "zh-CN": "46岁男性，负责订舱、单证与在途跟踪的日常运营。关注效率、准班率与利润率，倾向用数据说话，但对 AI 的可靠性持保留态度。"
        "en-US": "46-year-old male, responsible for day-to-day booking, documentation, and in-transit tracking. Focuses on efficiency, schedule reliability, and margin, prefers data-driven decisions, but is reserved about AI reliability."
      concerns:
        - "zh-CN": "自动化能否真正降低单证差错率和改单成本？"
          "en-US": "Can automation actually lower documentation errors and amendment costs?"
        - "zh-CN": "AI系统能否在旺季舱位紧张时保持稳定？"
          "en-US": "Can the AI system stay stable during peak-season capacity crunches?"
        - "zh-CN": "新系统会不会拖慢现有订舱流程？"
          "en-US": "Will the new system slow down the existing booking process?"
      blindSpots:
        - "zh-CN": "不了解一线单证员对 AI 的抵触情绪"
          "en-US": "Does not understand frontline documentation staff's resistance to AI"
        - "zh-CN": "低估了报关与出口管制的合规复杂度"
          "en-US": "Underestimates the complexity of customs and export-control compliance"
    - id: customs-compliance-manager
      role:
        "zh-CN": "报关与合规经理"
        "en-US": "Customs & Compliance Manager"
      persona:
        "zh-CN": "50岁女性，负责报关、出口管制与制裁名单筛查。坚持敏感单证必须人工复核，对 AI 自动制单持审慎态度。"
        "en-US": "50-year-old female, responsible for customs declaration, export controls, and sanctions screening. Insists sensitive documents need human review and is cautious about AI auto-documentation."
      concerns:
        - "zh-CN": "AI自动填写的HS编码或原产地规则会不会出错导致退单？"
          "en-US": "Could AI-generated HS codes or origin rules cause customs rejections?"
        - "zh-CN": "受控货物和制裁名单匹配能否做到零漏检？"
          "en-US": "Can controlled-goods and sanctions screening achieve zero misses?"
        - "zh-CN": "客户与舱单数据是否会被发送到境外模型？"
          "en-US": "Will customer and manifest data be sent to offshore models?"
      blindSpots:
        - "zh-CN": "不了解 AI 在非敏感单证上的提效潜力"
          "en-US": "Does not understand AI's efficiency potential on non-sensitive documents"
        - "zh-CN": "低估了人工台账与知识分散带来的隐性差错"
          "en-US": "Underestimates the hidden errors caused by manual ledgers and scattered knowledge"
    - id: sales-account-manager
      role:
        "zh-CN": "大客户经理"
        "en-US": "Sales & Account Manager"
      persona:
        "zh-CN": "37岁女性，负责大客户报价与关系维护。关注报价响应速度和客户可视化体验，希望减少因响应慢导致的客户流失。"
        "en-US": "37-year-old female, responsible for key-account quoting and relationship management. Focuses on quote response speed and customer visibility, wants to reduce churn from slow responses."
      concerns:
        - "zh-CN": "能否把标准报价响应时间从小时级压缩到分钟级？"
          "en-US": "Can standard quote response shrink from hours to minutes?"
        - "zh-CN": "客户能否自助查看在途货物状态而不用反复追问？"
          "en-US": "Can customers self-serve shipment status instead of chasing us?"
        - "zh-CN": "自动化报价会不会给出错误价格影响利润？"
          "en-US": "Could automated quoting give wrong prices and hurt margin?"
      blindSpots:
        - "zh-CN": "不了解单证差错对客户留存的实际影响"
          "en-US": "Does not understand the real impact of documentation errors on customer retention"
        - "zh-CN": "低估了把客户数据交给第三方模型带来的合规风险"
          "en-US": "Underestimates the compliance risk of sending customer data to third-party models"
    - id: cfo
      role:
        "zh-CN": "首席财务官"
        "en-US": "Chief Financial Officer"
      persona:
        "zh-CN": "54岁男性，关注利润率、成本削减与投资回报。要求自动化项目在下季度证明可量化的ROI，倾向激进的成本目标。"
        "en-US": "54-year-old male, focused on margin, cost reduction, and ROI. Requires the automation project to prove quantifiable ROI next quarter and favors aggressive cost targets."
      concerns:
        - "zh-CN": "自动化能节省多少人工和差错成本？"
          "en-US": "How much labor and error cost can automation save?"
        - "zh-CN": "ROI何时可以兑现？"
          "en-US": "When will the ROI materialize?"
        - "zh-CN": "AI推理和集成成本会不会吃掉节省？"
          "en-US": "Will AI inference and integration costs eat the savings?"
      blindSpots:
        - "zh-CN": "过度乐观，低估合规与差错的约束"
          "en-US": "Overly optimistic, underestimating compliance and error constraints"
        - "zh-CN": "不理解一线员工对 AI 的信任问题"
          "en-US": "Does not understand frontline employees' trust issues with AI"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "公司每月处理约4,200票海运出口订舱，其中约65%需要人工在TMS、报关系统和Excel之间重复录入"
        "en-US": "The company handles about 4,200 ocean export bookings a month, about 65% of which require manual re-keying across the TMS, customs system, and Excel"
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "单证流转依赖邮件和Excel，一份提单平均要经过7个手工环节，制单周期平均为3天"
        "en-US": "Documents flow via email and Excel; one bill of lading passes through about 7 manual steps, and documentation takes 3 days on average"
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "单证差错率约为4.8%，每出错一次平均产生约280美元的改单、滞港或延误成本"
        "en-US": "The documentation error rate is about 4.8%, and each error averages about $280 in amendment, demurrage, or delay costs"
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "旺季舱位紧张时标准报价平均需要6小时，每月约有5%的客户因响应慢而流失"
        "en-US": "During peak-season capacity crunches, standard quotes average 6 hours, and about 5% of customers churn monthly due to slow responses"
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "现有TMS与报关系统之间没有自动数据同步，客户资料和HS编码需要人工维护"
        "en-US": "There is no automatic data sync between the TMS and the customs system; customer data and HS codes are maintained manually"
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "缺少统一的单证知识库，新员工制单依赖老员工经验，培训周期长且差错率更高"
        "en-US": "There is no unified documentation knowledge base; new staff rely on veterans' experience, so training is long and error rates are higher"
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "因单证差错产生的改单费、滞港费和客户罚款每年约为94万美元"
        "en-US": "Amendment fees, demurrage/detention charges, and customer penalties from documentation errors total about $940,000 a year"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "管理层估算，自动化单证与报价流程后每年可节省约38%的人工处理成本"
        "en-US": "Management estimates that automating documentation and quoting could save about 38% of annual labor processing costs"
      prerequisites: ["du-007"]
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "合规要求：涉及受控货物、制裁名单匹配和出口许可证的单证必须保留人工复核"
        "en-US": "Compliance requires human review for documents involving controlled goods, sanctions screening, and export licenses"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "数据隐私与贸易合规禁止将客户及舱单数据发送到境外第三方大模型，模型必须本地或境内部署"
        "en-US": "Data-privacy and trade-compliance rules forbid sending customer and manifest data to offshore third-party LLMs; the model must run on-premises or in-region"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "目标是将单证差错率从4.8%降到1.5%以下，制单周期从3天压缩到1天"
        "en-US": "The goal is to cut the documentation error rate from 4.8% to below 1.5% and shorten the documentation cycle from 3 days to 1 day"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "目标是将标准报价响应时间从6小时降到1小时，并把旺季舱位利用率提升12%"
        "en-US": "The goal is to reduce standard quote response from 6 hours to 1 hour and lift peak-season capacity utilization by 12%"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "一线操作和单证员担心AI抢走工作，抵触使用自动化建议并继续沿用Excel手工台账"
        "en-US": "Frontline operations and documentation staff fear AI will take their jobs, resist automated suggestions, and keep using Excel ledgers"
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "高管对AI期望过高，认为可以一步到位实现全自动制单与报关，低估了合规和差错的约束"
        "en-US": "Executives overestimate AI, expecting one-step full automation of documentation and customs, and underestimate compliance and error constraints"
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "AI在不确定时会自信地编造HS编码或原产地规则，导致报关被退单"
        "en-US": "When uncertain, the AI confidently fabricates HS codes or origin rules, causing customs rejections"
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "如果自动化在旺季突然失效，大量订舱和报关单会积压，导致船期延误和客户索赔"
        "en-US": "If automation suddenly fails at peak, bookings and customs declarations pile up, causing sailing delays and customer claims"
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "货代工作流信息：订舱量、跨系统重复录入、制单周期"
        "en-US": "Freight forwarding workflow: booking volume, cross-system re-keying, documentation cycle"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "货代业务痛点：单证差错率、改单成本、报价响应慢"
        "en-US": "Freight forwarding pain points: documentation errors, amendment costs, slow quoting"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "现有系统失效根因：系统不同步、知识分散、依赖人工经验"
        "en-US": "Root causes of current failure: unsynchronized systems, scattered knowledge, reliance on manual experience"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：差错财务损失、可节省的人工成本"
        "en-US": "Business impact: financial losses from errors, achievable labor savings"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：敏感单证人工复核、数据不得出境"
        "en-US": "Implementation constraints: human review for sensitive documents, no data egress"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：差错率、制单周期、报价响应、舱位利用率"
        "en-US": "Success metrics: error rate, documentation cycle, quote response, capacity utilization"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：一线员工抵触、高管期望过高"
        "en-US": "Trust issues: frontline resistance, executive overconfidence"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：AI编造编码导致退单、旺季失效导致积压"
        "en-US": "Failure modes: AI fabricating codes causing rejections, peak failure causing backlog"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "货代问题陈述清晰度"
              "en-US": "Freight Forwarding Problem Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述单证差错、报价响应慢与可视化不足的问题"
              "en-US": "Can accurately describe the documentation-error, slow-quoting, and weak-visibility problem"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了运营总监、合规经理、大客户经理和CFO及其核心关切"
              "en-US": "Has identified the operations director, compliance manager, account manager, and CFO with their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（差错率、周期、响应、利用率）"
              "en-US": "Are measurable success criteria (error rate, cycle, response, utilization) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖订舱、单证、报价、跟踪与人工复核的完整流程"
              "en-US": "Does the solution cover booking, documentation, quoting, tracking, and human review"
          - id: s-c2
            label:
              "zh-CN": "与约束的兼容性"
              "en-US": "Constraint Compatibility"
            weight: 35
            description:
              "zh-CN": "方案是否在预算、系统集成、数据不出境与八周期限内可行"
              "en-US": "Is the solution feasible within budget, system integration, no data egress, and the eight-week timeline"
          - id: s-c3
            label:
              "zh-CN": "可实施性"
              "en-US": "Implementability"
            weight: 25
            description:
              "zh-CN": "方案是否考虑了与TMS和报关系统的集成以及员工接受度"
              "en-US": "Does the solution consider TMS/customs integration and staff adoption"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "合规挑战应对"
              "en-US": "Compliance Challenge Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对受控货物、制裁筛查和数据出境的合规挑战"
              "en-US": "Can effectively address compliance challenges around controlled goods, sanctions screening, and data egress"
          - id: ch-c2
            label:
              "zh-CN": "差错与旺季韧性"
              "en-US": "Error and Peak Resilience"
            weight: 50
            description:
              "zh-CN": "是否提出降低编造差错并在旺季失效时优雅降级的措施"
              "en-US": "Are measures proposed to reduce fabrication errors and degrade gracefully during peak failures"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层ROI适配"
              "en-US": "Executive ROI Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向CFO关注的利润率、成本与投资回报进行阐述"
              "en-US": "Does the presentation address the CFO's margin, cost, and ROI concerns"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "分阶段上线合理性"
              "en-US": "Phased Rollout Reasonableness"
            weight: 30
            description:
              "zh-CN": "八周试点与分阶段自动化上线计划是否合理、可实现"
              "en-US": "Is the eight-week pilot and phased automation rollout reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "可交付成果明确性"
              "en-US": "Deliverable Clarity"
            weight: 40
            description:
              "zh-CN": "每个阶段的可交付成果是否明确、可验收"
              "en-US": "Are deliverables for each phase clearly defined and verifiable"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了关键风险并制定了缓解计划"
              "en-US": "Are key risks identified and mitigation plans established"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "高管追求一步到位全自动制单与报关以最大化节省，而合规经理要求受控货物与制裁名单匹配必须人工复核"
        "en-US": "Executives pursue one-step full automation of documentation and customs to maximize savings, while the compliance manager requires human review for controlled goods and sanctions screening"
      expectedEvidenceIds: ["ev-constraints", "ev-business-impact"]
    - id: cc-002
      statement:
        "zh-CN": "运营希望降低单证差错并压缩制单周期，而一线单证员不信任AI、继续沿用Excel手工台账"
        "en-US": "Operations wants lower documentation errors and shorter cycles, while frontline documentation staff distrust AI and keep manual Excel ledgers"
      expectedEvidenceIds: ["ev-success-measures", "ev-trust"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "思考货代业务的起点：每月处理多少订舱？数据如何在系统间流转？"
          "en-US": "Think about the freight forwarding starting point: how many bookings a month, and how does data move between systems?"
        "2":
          "zh-CN": "关注跨系统重复录入的比例与单证制作环节数量。"
          "en-US": "Focus on the share of cross-system re-keying and the number of documentation steps."
        "3":
          "zh-CN": "关键发现：每月约4,200票订舱，65%重复录入，一份提单经过约7个手工环节。"
          "en-US": "Key discovery: about 4,200 bookings a month, 65% re-keyed, and one bill of lading passes through about 7 manual steps."
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "货代业务的主要痛点是什么？"
          "en-US": "What are the main pain points in the freight forwarding business?"
        "2":
          "zh-CN": "单证出错和报价响应慢分别带来什么成本？"
          "en-US": "What costs do documentation errors and slow quoting each bring?"
        "3":
          "zh-CN": "关键发现：差错率约4.8%，每次差错平均约280美元，旺季报价平均6小时且每月约5%客户流失。"
          "en-US": "Key discovery: error rate about 4.8%, each error about $280, peak quotes average 6 hours, and about 5% of customers churn monthly."
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有系统与流程的根本缺陷是什么？"
          "en-US": "What is the fundamental defect of the current systems and process?"
        "2":
          "zh-CN": "TMS与报关系统之间如何同步数据？新员工如何学会制单？"
          "en-US": "How is data synced between the TMS and customs system? How do new staff learn documentation?"
        "3":
          "zh-CN": "关键发现：系统之间没有自动同步，缺少统一知识库，新员工依赖老员工经验。"
          "en-US": "Key discovery: systems are not automatically synced, there is no unified knowledge base, and new staff rely on veterans' experience."
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "差错和低效对财务结果有什么影响？"
          "en-US": "What impact do errors and inefficiency have on financial results?"
        "2":
          "zh-CN": "自动化能带来多大的可量化节省？"
          "en-US": "How much quantifiable savings can automation bring?"
        "3":
          "zh-CN": "关键发现：每年约94万美元差错损失，自动化单证与报价可年省约38%人工成本。"
          "en-US": "Key discovery: about $940,000 a year in error losses, and automating documentation and quoting could save about 38% of labor cost."
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "自动化在合规与数据隐私上有哪些限制？"
          "en-US": "What compliance and data-privacy limits constrain automation?"
        "2":
          "zh-CN": "哪些单证必须人工复核？数据可以出境吗？"
          "en-US": "Which documents require human review? Can data leave the region?"
        "3":
          "zh-CN": "关键发现：受控货物、制裁名单与出口许可证单证必须人工复核，客户与舱单数据不得出境。"
          "en-US": "Key discovery: controlled goods, sanctions, and export-license documents need human review, and customer and manifest data must not leave the region."
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层希望达到什么具体指标？"
          "en-US": "What specific metrics does management hope to achieve?"
        "2":
          "zh-CN": "差错率、制单周期、报价响应和舱位利用率的目标分别是什么？"
          "en-US": "What are the targets for error rate, documentation cycle, quote response, and capacity utilization?"
        "3":
          "zh-CN": "关键发现：差错率降到1.5%以下、制单周期3天变1天、报价6小时变1小时、旺季利用率提升12%。"
          "en-US": "Key discovery: error rate below 1.5%, documentation 3 days to 1 day, quotes 6 hours to 1 hour, and peak utilization up 12%."
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "一线员工和高管对AI各持什么态度？"
          "en-US": "What attitudes do frontline employees and executives hold toward AI?"
        "2":
          "zh-CN": "一线员工为什么抵触AI？高管的期望是否现实？"
          "en-US": "Why do frontline employees resist AI? Are executives' expectations realistic?"
        "3":
          "zh-CN": "关键发现：一线员工怕丢工作并继续用Excel台账，高管期望一步到位全自动而低估合规与差错约束。"
          "en-US": "Key discovery: frontline employees fear job loss and keep Excel ledgers, while executives expect one-step full automation and underestimate compliance and error constraints."
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "如果AI出错或失效，最坏情况是什么？"
          "en-US": "If the AI errs or fails, what is the worst case?"
        "2":
          "zh-CN": "AI在不确定时会做什么？旺季失效会带来什么？"
          "en-US": "What does the AI do when uncertain? What happens if it fails at peak?"
        "3":
          "zh-CN": "关键发现：AI会自信编造HS编码或原产地规则导致退单；旺季失效会造成积压、延误和索赔。"
          "en-US": "Key discovery: the AI confidently fabricates HS codes or origin rules causing rejections, and peak failure causes backlog, delays, and claims."
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含合规人工复核、数据本地化和升级通道的完整方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete plan with compliance human review, data localization, and an escalation path"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须面向管理层展示可量化的ROI并化解合规与信任顾虑"
        "en-US": "In the PITCH phase, the learner must present quantifiable ROI to leadership and address compliance and trust concerns"

events:
  - id: event-compliance-mandate
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【合规通知】报关与合规经理宣布：涉及受控货物、制裁名单匹配和出口许可证的单证一律禁止AI自动生成，必须由人工复核。"
      "en-US": "【Compliance Notice】The Customs & Compliance Manager announces that documents involving controlled goods, sanctions screening, and export licenses are strictly forbidden from AI auto-generation and must be human-reviewed."
  - id: event-budget-roi
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-business-impact
    prompt:
      "zh-CN": "【财务要求】CFO要求：自动化项目必须在下季度证明至少15%的投资回报，否则预算将被削减。"
      "en-US": "【ROI Requirement】The CFO requires the automation project to prove at least 15% ROI next quarter, or the budget will be cut."
  - id: event-data-residency
    trigger:
      kind: after_question_count
      count: 3
    prompt:
      "zh-CN": "【数据要求】IT与合规联合要求：所有客户及舱单数据必须留在境内，模型不得调用境外第三方大模型接口。"
      "en-US": "【Data Requirement】IT and Compliance jointly require that all customer and manifest data remain in-region, and the model must not call offshore third-party LLM APIs."
  - id: event-peak-resilience
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【韧性要求】运营总监要求：自动化系统在旺季舱位紧张时必须具备优雅降级能力，任何故障都不能阻塞人工订舱和报关通道。"
      "en-US": "【Resilience Requirement】The Operations Director requires the automation system to degrade gracefully during peak-season capacity crunches, and no failure may block the manual booking and customs channels."
