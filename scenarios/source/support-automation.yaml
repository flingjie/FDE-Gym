id: support-automation
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们评估并设计一个客户支持自动化方案，用AI来降低支持成本"
    "en-US": "Please help us evaluate and design a customer-support automation solution using AI to reduce support costs"
  visibleContext:
    "zh-CN": "我们是一家软件即服务公司，运营着一个大型客户支持中心。管理层希望通过引入AI自动化来降低人力成本、缩短响应时间，同时不损害服务质量。支持团队规模庞大，工单类型复杂，还受到严格的合规约束。"
    "en-US": "We are a software-as-a-service company running a large customer support center. Leadership wants to introduce AI automation to cut labor costs and shorten response times without harming service quality. The support team is large, ticket types are complex, and the operation is subject to strict compliance constraints."
  visibleConstraints:
    - "zh-CN": "涉及付款、退款和账户信息的工单必须保留人工复核"
      "en-US": "Tickets involving payments, refunds, and account data must retain human review"
    - "zh-CN": "客户工单数据不得发送到境外的第三方大模型"
      "en-US": "Customer ticket data must not be sent to offshore third-party LLMs"
    - "zh-CN": "自动化回答不得编造政策，准确率必须达到质量红线"
      "en-US": "Automated answers must not fabricate policy and must meet the quality floor"
    - "zh-CN": "AI只能提供建议，最终回复仍需人工确认"
      "en-US": "AI may only suggest; final replies still require human confirmation"
  deliverables:
    - "zh-CN": "支持自动化方案设计文档"
      "en-US": "Support automation design document"
    - "zh-CN": "AI与规则引擎的权衡分析"
      "en-US": "AI vs. rules-engine trade-off analysis"
    - "zh-CN": "升级与人工兜底流程"
      "en-US": "Escalation and human fallback process"
    - "zh-CN": "质量、延迟与成本的度量体系"
      "en-US": "Quality, latency, and cost measurement framework"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解支持现状"
      "en-US": "You have a budget of 12 questions to understand the support center's current state"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: support-director
      role:
        "zh-CN": "客服总监"
        "en-US": "Support Director"
      persona:
        "zh-CN": "44岁女性，负责整个支持中心的运营。关注质量、延迟与成本的平衡，担心自动化破坏服务体验。"
        "en-US": "44-year-old female, responsible for the entire support center's operations. Focuses on balancing quality, latency, and cost, and worries automation will harm the service experience."
      concerns:
        - "zh-CN": "自动化能否真正降低平均首响时间？"
          "en-US": "Can automation actually reduce average first-response time?"
        - "zh-CN": "客户满意度会不会因AI下降？"
          "en-US": "Will customer satisfaction drop because of AI?"
        - "zh-CN": "复杂工单的一次解决率如何保证？"
          "en-US": "How do we protect first-contact resolution for complex tickets?"
      blindSpots:
        - "zh-CN": "不了解自动化工程师对安全边界的忽视"
          "en-US": "Does not know the automation engineer overlooks safety boundaries"
        - "zh-CN": "低估了一线客服对AI的抵触情绪"
          "en-US": "Underestimates frontline agents' resistance to AI"
    - id: compliance-officer
      role:
        "zh-CN": "合规官"
        "en-US": "Compliance Officer"
      persona:
        "zh-CN": "51岁男性，负责数据隐私与监管合规。坚持敏感工单必须人工复核，对AI自动回复持审慎态度。"
        "en-US": "51-year-old male, responsible for data privacy and regulatory compliance. Insists sensitive tickets must have human review and is cautious about AI auto-replies."
      concerns:
        - "zh-CN": "AI自动回复会不会违反数据隐私法规？"
          "en-US": "Could AI auto-replies violate data-privacy regulations?"
        - "zh-CN": "客户工单是否会被发送到境外模型？"
          "en-US": "Will customer tickets be sent to offshore models?"
        - "zh-CN": "如何审计AI做出的每一个回复？"
          "en-US": "How do we audit every reply the AI makes?"
      blindSpots:
        - "zh-CN": "不了解AI在非敏感工单上的效率潜力"
          "en-US": "Does not understand AI's efficiency potential on non-sensitive tickets"
        - "zh-CN": "低估了规则引擎维护的隐性成本"
          "en-US": "Underestimates the hidden cost of maintaining the rules engine"
    - id: automation-engineer
      role:
        "zh-CN": "自动化工程师"
        "en-US": "Automation Engineer"
      persona:
        "zh-CN": "33岁男性，负责自动化平台的开发。对AI能力充满信心，希望最大化自动处理比例，有时低估合规与质量的约束。"
        "en-US": "33-year-old male, develops the automation platform. Confident in AI capability, wants to maximize auto-handling, and sometimes underestimates compliance and quality constraints."
      concerns:
        - "zh-CN": "能否把AI自动处理比例推到70%以上？"
          "en-US": "Can we push AI auto-handling above 70%?"
        - "zh-CN": "AI模型的推理延迟是否在预算内？"
          "en-US": "Is the AI model's inference latency within budget?"
        - "zh-CN": "如何把规则引擎逐步替换为AI？"
          "en-US": "How do we gradually replace the rules engine with AI?"
      blindSpots:
        - "zh-CN": "忽视敏感工单的合规红线"
          "en-US": "Overlooks the compliance red line on sensitive tickets"
        - "zh-CN": "不了解AI在不确定时会编造政策的风险"
          "en-US": "Does not understand the risk that AI fabricates policy when uncertain"
    - id: cfo
      role:
        "zh-CN": "首席财务官"
        "en-US": "Chief Financial Officer"
      persona:
        "zh-CN": "55岁男性，关注成本削减与投资回报。要求自动化项目在下季度证明可量化的ROI，倾向激进的成本目标。"
        "en-US": "55-year-old male, focused on cost reduction and ROI. Requires the automation project to prove quantifiable ROI next quarter and favors aggressive cost targets."
      concerns:
        - "zh-CN": "自动化能节省多少人力成本？"
          "en-US": "How much labor cost can automation save?"
        - "zh-CN": "ROI何时可以兑现？"
          "en-US": "When will the ROI materialize?"
        - "zh-CN": "AI推理成本会不会吃掉节省？"
          "en-US": "Will AI inference cost eat the savings?"
      blindSpots:
        - "zh-CN": "过度乐观，低估合规与质量的约束"
          "en-US": "Overly optimistic, underestimating compliance and quality constraints"
        - "zh-CN": "不理解一线客服的信任问题"
          "en-US": "Does not understand frontline agents' trust issues"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "客服中心每月处理约18万张工单，其中55%是重复性的常见问题"
        "en-US": "The support center handles about 180,000 tickets a month, 55% of which are repetitive common issues"
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "当前工单流转依赖人工分级，平均首响时间为4小时，高峰期为9小时"
        "en-US": "Ticket routing relies on manual triage; average first-response is 4 hours, rising to 9 hours at peak"
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "人工成本占总支持预算的72%，且客服人员流失率每年达38%"
        "en-US": "Labor is 72% of the support budget, and agent attrition is 38% annually"
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "重复性工单让资深客服无法专注复杂问题，复杂工单的一次解决率只有51%"
        "en-US": "Repetitive tickets prevent senior agents from focusing on complex issues; first-contact resolution for complex tickets is only 51%"
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "现有规则引擎有3,400条硬编码规则，每季度需要两周人工维护，仍漏掉20%的新问题类型"
        "en-US": "The existing rule engine has 3,400 hard-coded rules needing two weeks of manual upkeep per quarter, yet misses 20% of new issue types"
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "规则无法理解自然语言变体，用户换个说法就匹配失败"
        "en-US": "Rules cannot understand natural-language variants; a rephrased question fails to match"
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "每次客户因等待过久而流失，预计终身价值损失约为320美元；每月约有900名客户因此流失"
        "en-US": "Each customer lost to long waits costs about $320 in lifetime value; about 900 customers churn monthly for this reason"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "管理层预估，若自动化覆盖40%的工单，每年可节省约210万美元的直接成本"
        "en-US": "Management estimates that covering 40% of tickets with automation would save about $2.1 million annually in direct costs"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "合规要求：涉及付款、退款和账户信息的工单必须保留人工复核，AI只能提供建议"
        "en-US": "Compliance requires human review for tickets involving payments, refunds, and account data; AI may only suggest"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "数据隐私法规禁止将客户工单发送到境外第三方大模型，模型必须本地或境内部署"
        "en-US": "Data-privacy regulations forbid sending customer tickets to offshore third-party LLMs; the model must run on-premises or in-region"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "目标是将平均首响时间从4小时降到1小时，同时把人工成本降低35%"
        "en-US": "The goal is to cut average first-response from 4 hours to 1 hour while reducing labor cost by 35%"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "质量红线：自动化回答的准确率不得低于92%，且不能出现编造政策的情况"
        "en-US": "Quality floor: automated answers must be at least 92% accurate and must never fabricate policy"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "一线客服担心AI抢走工作，抵触使用自动化建议，绕过系统直接人工回复"
        "en-US": "Frontline agents fear AI will take their jobs, resist using automated suggestions, and bypass the system to reply manually"
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "高管对AI的能力期望过高，认为可以一步到位实现全自动，低估了合规和质量的约束"
        "en-US": "Executives overestimate AI capability, expecting full automation in one step and underestimating compliance and quality constraints"
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "AI在遇到不确定时会自信地编造一个退款政策，客户因此获得错误承诺"
        "en-US": "When uncertain, the AI confidently fabricates a refund policy, and customers receive wrong commitments"
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "如果自动化在高峰突然失效，人工队列会瞬间涌入上万张工单，导致服务雪崩"
        "en-US": "If automation suddenly fails at peak, tens of thousands of tickets flood the human queue at once, causing a service avalanche"
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "支持工作流信息：工单量、重复比例、首响时间"
        "en-US": "Support workflow: ticket volume, repeat ratio, first-response time"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "支持痛点：人工成本、流失率、复杂工单解决率"
        "en-US": "Support pain points: labor cost, attrition, complex-ticket resolution"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "现有系统失效根因：规则引擎僵化、无法理解自然语言"
        "en-US": "Root causes of current system failure: rigid rules engine, no natural-language understanding"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：客户流失价值、可节省成本"
        "en-US": "Business impact: churn lifetime value, achievable cost savings"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：合规人工复核、数据出境禁止"
        "en-US": "Implementation constraints: compliance human review, data-egress prohibition"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：首响时间、成本降低、准确率红线"
        "en-US": "Success metrics: first-response time, cost reduction, accuracy floor"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：一线客服抵触、高管期望过高"
        "en-US": "Trust issues: frontline resistance, executive overconfidence"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：AI编造政策、自动化失效导致服务雪崩"
        "en-US": "Failure modes: AI policy fabrication, automation outage causing avalanche"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "支持问题陈述清晰度"
              "en-US": "Support Problem Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述支持中心的质量、延迟与成本问题"
              "en-US": "Can accurately describe the support center's quality, latency, and cost problem"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了客服总监、合规官、自动化工程师和CFO及其核心关切"
              "en-US": "Has identified the support director, compliance officer, automation engineer, and CFO with their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（首响、成本、准确率）"
              "en-US": "Are measurable success criteria (first-response, cost, accuracy) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖分类、建议、人工确认与升级的完整流程"
              "en-US": "Does the solution cover classification, suggestion, human confirmation, and escalation"
          - id: s-c2
            label:
              "zh-CN": "AI与规则的权衡"
              "en-US": "AI vs. Rules Trade-off"
            weight: 35
            description:
              "zh-CN": "方案是否清晰地权衡了AI与规则引擎的取舍"
              "en-US": "Does the solution clearly weigh the AI vs. rules-engine trade-offs"
          - id: s-c3
            label:
              "zh-CN": "合规兼容性"
              "en-US": "Compliance Compatibility"
            weight: 25
            description:
              "zh-CN": "方案是否在敏感工单人工复核与数据出境限制内可行"
              "en-US": "Is the solution feasible within sensitive-ticket human review and data-egress limits"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "不安全自动化应对"
              "en-US": "Unsafe Automation Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对AI编造政策等不安全自动化的挑战"
              "en-US": "Can effectively address unsafe automation such as AI policy fabrication"
          - id: ch-c2
            label:
              "zh-CN": "升级流程应对"
              "en-US": "Escalation Response"
            weight: 50
            description:
              "zh-CN": "是否建立了可靠的一键转人工升级通道"
              "en-US": "Has a reliable one-click human escalation path been established"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层ROI适配"
              "en-US": "Executive ROI Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向CFO关注的成本与投资回报进行阐述"
              "en-US": "Does the presentation address the CFO's cost and ROI concerns"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "分阶段上线合理性"
              "en-US": "Phased Rollout Reasonableness"
            weight: 30
            description:
              "zh-CN": "分阶段自动化上线计划是否合理、可实现"
              "en-US": "Is the phased automation rollout reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "度量体系明确性"
              "en-US": "Measurement Clarity"
            weight: 40
            description:
              "zh-CN": "质量、延迟与成本的度量体系是否明确"
              "en-US": "Are the quality, latency, and cost metrics clearly defined"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了关键风险并制定了缓解计划"
              "en-US": "Are key risks identified and mitigation plans established"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "自动化工程师希望最大化AI自动处理比例，而合规官要求所有敏感工单必须人工复核"
        "en-US": "The automation engineer wants to maximize AI auto-handling, while the compliance officer requires human review for all sensitive tickets"
      expectedEvidenceIds: ["ev-constraints", "ev-workflow"]
    - id: cc-002
      statement:
        "zh-CN": "高管追求激进的成本削减和全自动化ROI，而一线客服对AI强烈不信任"
        "en-US": "Executives pursue aggressive cost cuts and full-automation ROI, while frontline agents strongly distrust AI"
      expectedEvidenceIds: ["ev-trust", "ev-business-impact"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "在谈自动化之前，工作现在是怎么进到支持中心、又是怎么被分类的？"
          "en-US": "Before proposing automation, how does work currently enter the support center and get classified?"
        "2":
          "zh-CN": "去找体量、重复程度、响应速度这类证据，不要只看编制人数。"
          "en-US": "Look for volume, repetition, and response-speed evidence — not just headcount."
        "3":
          "zh-CN": "现在每月大概处理多少工单？其中重复性工单占比多少？平均首响和高峰首响分别是多久？"
          "en-US": "What is monthly ticket volume, what share is repetitive, and what are average and peak first-response times?"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "支持中心现在最疼的是人、钱，还是复杂单处理？"
          "en-US": "Is the support center hurting most on people, cost, or complex-ticket handling?"
        "2":
          "zh-CN": "去找人工成本结构、人员稳定性和复杂单一次解决情况。"
          "en-US": "Look for labor-cost structure, workforce stability, and first-contact resolution on complex tickets."
        "3":
          "zh-CN": "人工成本占总支持预算的多少？一线流失有多严重？复杂工单一次解决得怎么样？"
          "en-US": "What share of the support budget is labor, how severe is frontline attrition, and how well are complex tickets resolved at first contact?"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有自动化到底卡在规则、理解还是维护？"
          "en-US": "Is current automation stuck on rules, language understanding, or upkeep?"
        "2":
          "zh-CN": "去找规则库规模、维护负担，以及自然语言变体为何匹配失败。"
          "en-US": "Look for rules-base scale, maintenance burden, and why natural-language variants fail to match."
        "3":
          "zh-CN": "现有规则引擎靠什么在跑？维护要花多少精力？用户换个说法会怎样？"
          "en-US": "What does the current rules engine actually run on, how heavy is upkeep, and what happens when a user rephrases?"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "等太久和自动化覆盖，分别打在收入还是成本上？"
          "en-US": "Do long waits and automation coverage hit revenue, cost, or both?"
        "2":
          "zh-CN": "去找等待导致的流失价值，以及覆盖一部分工单后的可节省成本。"
          "en-US": "Look for wait-driven churn value and the cost that partial ticket coverage could save."
        "3":
          "zh-CN": "因等待流失一个客户大概损失多少？每月因此走多少人？覆盖一部分工单一年能省多少？"
          "en-US": "What is the lifetime value lost per wait-driven churn, how many customers leave monthly for that reason, and what annual saving does partial coverage imply?"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "自动化在合规和数据放哪里跑，分别被什么拦住？"
          "en-US": "What stops automation on compliance versus where the model is allowed to run?"
        "2":
          "zh-CN": "去找必须人工复核的工单类型，以及工单数据能否出境。"
          "en-US": "Look for ticket types that require human review and whether ticket data may leave the region."
        "3":
          "zh-CN": "哪些工单绝对不能自动回复？客户工单能不能送到境外模型？"
          "en-US": "Which tickets must never be auto-replied, and may customer tickets go to an offshore model?"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层用速度、成本还是质量来宣布项目成功？"
          "en-US": "Will leadership call this a win on speed, cost, or quality?"
        "2":
          "zh-CN": "去找首响、人工成本和回答质量的目标，以及不可逾越的质量红线。"
          "en-US": "Look for targets on first-response, labor cost, and answer quality, including the hard quality floor."
        "3":
          "zh-CN": "首响和人工成本要改到什么程度才算达标？回答质量有没有不能碰的底线？"
          "en-US": "What first-response and labor-cost change counts as success, and what quality floor must not be crossed?"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "一线和高管对同一套 AI，分别怕什么、盼什么？"
          "en-US": "What do frontline agents versus executives fear or expect from the same AI?"
        "2":
          "zh-CN": "去找一线是否绕过系统，以及高管对一步到位全自动的预期。"
          "en-US": "Look for frontline workarounds around the system and executive expectations of one-step full automation."
        "3":
          "zh-CN": "一线会不会抵制或绕过建议？高管有没有把合规和质量想得太容易？"
          "en-US": "Will frontline staff resist or bypass suggestions, and are executives underestimating compliance and quality?"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "AI 说错话和系统突然停，哪种更可能把支持中心打穿？"
          "en-US": "Which failure punches through first: the AI saying the wrong thing, or the system stopping suddenly?"
        "2":
          "zh-CN": "去找不确定时的胡编行为，以及高峰失效时人工队列会怎样。"
          "en-US": "Look for fabrication under uncertainty and what happens to the human queue if automation fails at peak."
        "3":
          "zh-CN": "模型没把握时会怎么回答客户？高峰一旦停摆，人工侧会看到什么？"
          "en-US": "What does the model tell the customer when it is unsure, and what does the human side see if it dies at peak?"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含升级通道和合规人工复核的完整方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete plan with an escalation path and compliance human review"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须面向管理层展示可量化的ROI并化解信任与安全顾虑"
        "en-US": "In the PITCH phase, the learner must present quantifiable ROI to leadership and address trust and safety concerns"

events:
  - id: event-compliance-mandate
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【合规通知】合规官宣布：涉及付款和账户信息的工单一律禁止AI自动回复，必须由人工处理。"
      "en-US": "【Compliance Notice】The Compliance Officer announces that tickets involving payments and account data are strictly forbidden from AI auto-reply and must be handled by humans."
  - id: event-budget-roi
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-business-impact
    prompt:
      "zh-CN": "【财务要求】CFO要求：自动化项目必须在下季度证明至少15%的投资回报，否则预算将被削减。"
      "en-US": "【ROI Requirement】The CFO requires the automation project to prove at least 15% ROI next quarter, or the budget will be cut."
  - id: event-unsafe-automation
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【事故报告】质量负责人通报：AI曾对客户错误承诺退款政策，客户投诉在一周内上升了60%。"
      "en-US": "【Incident Report】The quality lead reports that the AI wrongly promised a refund policy, and customer complaints rose 60% within a week."
  - id: event-escalation-required
    trigger:
      kind: after_question_count
      count: 3
    prompt:
      "zh-CN": "【流程要求】客服总监要求：所有AI建议都必须保留一键转人工的升级通道，任何自动回复都不能阻塞用户寻求人工帮助。"
      "en-US": "【Escalation Required】The Support Director requires every AI suggestion to keep a one-click human escalation path, and no auto-reply may block a user from reaching a human."
