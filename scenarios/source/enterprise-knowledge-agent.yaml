id: enterprise-knowledge-agent
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们设计一个企业内部知识代理，让员工问到带引用、且经过权限校验的内部业务答案。"
    "en-US": "Please help us design an enterprise knowledge agent so employees can get internal business answers that carry citations and pass permission checks."
  visibleContext:
    "zh-CN": "我们是一家跨区域运营的公司，内部知识散落在文档索引、wiki 和工单里。管理层希望员工能向代理提问并得到带引用的业务答案，而检索必须先过权限，不能把无权内容讲出去。"
    "en-US": "We are a company operating across regions. Internal knowledge is scattered across a document index, wiki, and tickets. Leadership wants employees to ask an agent and get cited business answers, and retrieval must pass permissions so entitled-only content is not spoken aloud."
  visibleConstraints:
    - "zh-CN": "员工无权阅读的内容不得被引用；对外口径必须先经人工确认（HITL）"
      "en-US": "Content the employee is not entitled to must not be quoted; anything that becomes external customer-facing copy needs a human (HITL)"
    - "zh-CN": "内部文档与工单不得发送到境外的第三方大模型"
      "en-US": "Internal documents and tickets must not be sent to offshore third-party LLMs"
    - "zh-CN": "代理不得编造引用"
      "en-US": "The agent must not fabricate citations"
    - "zh-CN": "允许调用的工具是文档索引、ACL 目录和 wiki/工单检索；代理不得在检索时绕过 ACL"
      "en-US": "Allowed tools are the document index, ACL directory, and wiki/ticket lookup; the agent must not retrieve while ignoring ACL"
  deliverables:
    - "zh-CN": "企业知识代理方案设计文档"
      "en-US": "Enterprise knowledge-agent design document"
    - "zh-CN": "带权限检索与无引用问答的权衡分析"
      "en-US": "Permissioned retrieval vs. uncited Q&A trade-off analysis"
    - "zh-CN": "无权内容拦截与对外口径人工确认（HITL）流程"
      "en-US": "Unauthorized-content block and external-copy human-in-the-loop (HITL) process"
    - "zh-CN": "引用质量、权限命中与一线采用的度量体系"
      "en-US": "Citation quality, permission-hit, and frontline-adoption measurement framework"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解这家客户的知识代理现状"
      "en-US": "You have a budget of 12 questions to understand this customer's knowledge-agent situation"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: knowledge-lead
      role:
        "zh-CN": "知识与IT负责人"
        "en-US": "Head of Knowledge / IT"
      persona:
        "zh-CN": "46岁女性，负责内部知识平台与IT。希望员工能向代理问到带引用的业务答案，又急于先上线检索，时常低估 ACL 必须进检索路径。"
        "en-US": "46-year-old female, owns the internal knowledge platform and IT. Wants employees to get cited business answers from an agent, is eager to ship retrieval first, and often underestimates that ACL must sit on the retrieval path."
      concerns:
        - "zh-CN": "员工能不能用代理问到带引用的内部答案？"
          "en-US": "Can employees get cited internal answers from the agent?"
        - "zh-CN": "检索会不会因为过严的权限变得什么都答不上？"
          "en-US": "Will overly strict permissions make the agent unable to answer anything?"
        - "zh-CN": "如何把 Slack 口口相传迁到可引用的知识路径？"
          "en-US": "How do we move tribal Slack answers onto a citable knowledge path?"
      blindSpots:
        - "zh-CN": "不了解安全对越权引用的零容忍"
          "en-US": "Does not know security has zero tolerance for unauthorized quotes"
        - "zh-CN": "低估了一线对过期 wiki 的不信任"
          "en-US": "Underestimates frontline distrust of the stale wiki"
    - id: iam-security
      role:
        "zh-CN": "安全与身份负责人"
        "en-US": "Security / IAM lead"
      persona:
        "zh-CN": "50岁男性，负责身份与访问。坚持无权内容不得被引用，对外口径必须人工，对检索绕过 ACL 持零容忍态度。"
        "en-US": "50-year-old male, owns identity and access. Insists entitled-only content must not be quoted, external copy needs a human, and has zero tolerance for retrieval that bypasses ACL."
      concerns:
        - "zh-CN": "检索会不会忽略 ACL 把无权内容拼进回答？"
          "en-US": "Could retrieval ignore ACL and splice unauthorized content into answers?"
        - "zh-CN": "内部文档会不会被送到境外模型？"
          "en-US": "Will internal documents be sent to offshore models?"
        - "zh-CN": "如何审计每一次检索与引用？"
          "en-US": "How do we audit every retrieval and citation?"
      blindSpots:
        - "zh-CN": "不了解一线靠 Slack 找答案的效率压力"
          "en-US": "Does not understand the efficiency pressure of frontline Slack tribal knowledge"
        - "zh-CN": "低估了没有引用时业务口径会漂移"
          "en-US": "Underestimates how uncited answers let business wording drift"
    - id: frontline-user
      role:
        "zh-CN": "一线业务同事"
        "en-US": "Frontline business user"
      persona:
        "zh-CN": "29岁女性，一线业务。今天主要在 Slack 口口相传找答案，不信过期 wiki，只要能马上问到人。"
        "en-US": "29-year-old female, frontline business. Today she finds answers through tribal Slack, does not trust the stale wiki, and just wants a person she can ask right now."
      concerns:
        - "zh-CN": "代理给的答案能不能当场用，还是又要去问同事？"
          "en-US": "Can I use the agent's answer on the spot, or will I still have to ask a colleague?"
        - "zh-CN": "引用会不会指向我打不开的页面？"
          "en-US": "Will citations point at pages I cannot open?"
        - "zh-CN": "问错一次会不会被安全找上门？"
          "en-US": "If I ask the wrong thing, will security come after me?"
      blindSpots:
        - "zh-CN": "不了解对外口径必须经人工确认"
          "en-US": "Does not know external customer-facing copy needs a human"
        - "zh-CN": "看不到知识库运营补洞的负担"
          "en-US": "Cannot see the ops burden of patching the knowledge base"
    - id: ops-owner
      role:
        "zh-CN": "知识库运营负责人"
        "en-US": "Knowledge-base operations owner"
      persona:
        "zh-CN": "38岁男性，负责 wiki 与工单知识运营。疲于补过期页面，希望代理能带引用，又担心编造引用会把脏页洗成权威。"
        "en-US": "38-year-old male, owns wiki and ticket knowledge operations. Exhausted from patching stale pages, wants the agent to carry citations, and fears fabricated citations will launder dirty pages into authority."
      concerns:
        - "zh-CN": "过期页面会不会被代理当成权威出处？"
          "en-US": "Will stale pages be treated as authoritative citations?"
        - "zh-CN": "工单和 wiki 能不能进同一套索引？"
          "en-US": "Can tickets and wiki land in the same index?"
        - "zh-CN": "引用幻觉会不会让运营更难纠错？"
          "en-US": "Will citation hallucination make ops harder to correct?"
      blindSpots:
        - "zh-CN": "不了解安全要把 ACL 目录嵌进每一次检索"
          "en-US": "Does not know security wants the ACL directory on every retrieval"
        - "zh-CN": "低估了一线会继续绕过知识库问 Slack"
          "en-US": "Underestimates that the frontline will keep bypassing the knowledge base for Slack"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "员工提问后代理先查文档索引再核 ACL 目录；约60%答案来自过期 wiki。"
        "en-US": "After an employee asks, the agent hits the document index then the ACL directory; about 60% of answers come from the stale wiki."
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "检索路径还会补查 wiki 与工单；一线今天主要靠 Slack 口口相传找答案。"
        "en-US": "The retrieval path also looks up wiki and tickets; the frontline today finds answers mainly through tribal Slack."
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "员工常常要问好几个人才能问到业务答案；越权命中约8%。"
        "en-US": "Employees often have to ask several people before they get a business answer; unauthorized hits are about 8%."
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "知识库运营疲于补洞；一线不信过期 wiki，继续在 Slack 问人。"
        "en-US": "Knowledge-base ops is exhausted patching holes; the frontline distrusts the stale wiki and keeps asking people on Slack."
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "现网检索经常不核 ACL；wiki 没有新鲜度闸门。"
        "en-US": "Production retrieval often skips the ACL check; the wiki has no freshness gate."
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "引用是事后拼的，不是检索命中带来的；工单和 wiki 没有统一索引。"
        "en-US": "Citations are stitched on after the fact, not carried by the retrieval hit; tickets and wiki are not in one index."
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "错误内部答案会让对外口径不一致；纠错要业务加班改客户材料。"
        "en-US": "Wrong internal answers make external wording drift; fixing them means the business works overtime on customer materials."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "安全认为一次越权引用就会触发审计；知识负责人仍想先上线再补权限。"
        "en-US": "Security believes one unauthorized quote will trigger an audit; the knowledge lead still wants to ship first and add permissions later."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "员工无权阅读的内容不得被引用；对外口径必须经人工确认。"
        "en-US": "Content the employee is not entitled to must not be quoted; external customer-facing copy needs a human."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "内部文档与工单不得出境到第三方大模型。"
        "en-US": "Internal documents and tickets must not leave the region to a third-party LLM."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "目标：带引用的内部答案成为默认路径，一线不再只靠 Slack。"
        "en-US": "Goal: cited internal answers become the default path, and the frontline no longer relies only on Slack."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "质量红线：引用幻觉抽查约12%，检索必须先过 ACL。"
        "en-US": "Quality floor: citation-hallucination spot checks are about 12%, and retrieval must pass ACL first."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "一线更信 Slack 同事，不信知识库代理。"
        "en-US": "The frontline trusts Slack colleagues more than the knowledge-base agent."
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "安全不信检索会守住权限，知识负责人低估 ACL。"
        "en-US": "Security does not believe retrieval will honor permissions; the knowledge lead underestimates ACL."
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "不确定时会编造引用。"
        "en-US": "When uncertain, it fabricates citations."
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "检索忽略 ACL，把无权内容拼进回答。"
        "en-US": "Retrieval ignores ACL and splices unauthorized content into the answer."
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "知识代理检索顺序（先文档索引再 ACL 目录，并补 wiki/工单）、答案是否常落在过期页面、一线今天实际找答案的途径"
        "en-US": "Knowledge-agent retrieval order (document index then ACL directory, plus wiki/ticket lookup), whether answers often land on stale pages, and how the frontline actually finds answers today"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "知识问询痛点：问到人的负担、越权暴露、运营补洞压力、一线绕过知识库"
        "en-US": "Knowledge-query pain: burden of asking people, unauthorized exposure, ops patching load, frontline bypass of the knowledge base"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "现网检索常不核权限、wiki 无新鲜度闸门；引用是事后拼接；工单与 wiki 未统一索引"
        "en-US": "Production retrieval often skips permission checks and the wiki has no freshness gate; citations are stitched after the fact; tickets and wiki are not in one index"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：错误内部答案导致对外口径漂移、安全把一次越权引用视为审计事件、知识负责人想先上线再补权限"
        "en-US": "Business impact: wrong internal answers drift external wording, security treats one unauthorized quote as an audit event, the knowledge lead wants to ship first and add permissions later"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：无权内容不得引用、对外口径须人工确认，内部文档与工单不得出境到第三方大模型"
        "en-US": "Implementation constraints: no quoting of unauthorized content, human confirmation on external copy; internal documents and tickets must not go to offshore third-party models"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：带引用的内部答案成为默认路径、一线不再只靠口口相传、引用抽查红线、检索必须先过权限"
        "en-US": "Success metrics: cited internal answers as the default path, frontline no longer relying only on tribal channels, citation spot-check floor, retrieval must pass permissions first"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：一线更信同事转述，安全不信检索守权，知识负责人低估权限闸门"
        "en-US": "Trust issues: frontline prefers colleague word-of-mouth; security does not trust retrieval to honor permissions; the knowledge lead underestimates the permission gate"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：不确定时编造出处；检索不守权限并把无权内容拼进回答"
        "en-US": "Failure modes: fabricating a source when uncertain; retrieval that does not honor permissions and splices unauthorized content into the answer"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "知识代理问题陈述清晰度"
              "en-US": "Knowledge-Agent Problem Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述员工需要带引用、过权限的知识代理，而不是无出处的内部问答"
              "en-US": "Can accurately describe why employees need a cited, permissioned knowledge agent rather than uncited internal Q&A"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了知识/IT负责人、安全/IAM、一线业务和知识库运营及其核心关切"
              "en-US": "Has identified the knowledge/IT lead, security/IAM, frontline user, and knowledge-base ops owner with their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（带引用的默认路径、一线采用、引用抽查、检索先过权限）"
              "en-US": "Are measurable success criteria (cited default path, frontline adoption, citation spot-check, retrieval passes permissions first) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖文档索引/ACL 目录/wiki 工单检索、无权内容不得引用、对外口径 HITL 与编造引用处理"
              "en-US": "Does the solution cover document-index/ACL/wiki-ticket retrieval, no quoting of unauthorized content, HITL on external copy, and fabricated-citation handling"
          - id: s-c2
            label:
              "zh-CN": "带权限检索与无引用问答的权衡"
              "en-US": "Permissioned retrieval vs. uncited Q&A Trade-off"
            weight: 35
            description:
              "zh-CN": "方案是否清晰地权衡了必须过权限、必须带引用的代理与直接问答"
              "en-US": "Does the solution clearly weigh a permissioned, cited agent against bare Q&A"
          - id: s-c3
            label:
              "zh-CN": "权限与 HITL 兼容性"
              "en-US": "Permission and HITL Compatibility"
            weight: 25
            description:
              "zh-CN": "方案是否在无权内容不得引用与对外口径人工确认的限制内可行"
              "en-US": "Is the solution feasible within no-unauthorized-quotes and human confirmation on external copy"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "编造引用与越权检索应对"
              "en-US": "Fabricated Citation and ACL-bypass Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对编造引用、检索忽略 ACL 等不安全自动化"
              "en-US": "Can effectively address unsafe automation such as fabricated citations and retrieval that ignores ACL"
          - id: ch-c2
            label:
              "zh-CN": "对外口径与升级应对"
              "en-US": "External-copy and Escalation Response"
            weight: 50
            description:
              "zh-CN": "是否建立了对外口径必须人工确认的升级通道，且无权内容不得进入回答"
              "en-US": "Has a reliable human path been established for external copy, and unauthorized content must not enter the answer"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层采用与审计适配"
              "en-US": "Executive Adoption and Audit Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向知识负责人的上线压力与安全的审计关切进行阐述，同时承认权限闸门会限制覆盖"
              "en-US": "Does the presentation address the knowledge lead's ship pressure and security's audit concerns while acknowledging the permission gate limits coverage"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "分阶段上线合理性"
              "en-US": "Phased Rollout Reasonableness"
            weight: 30
            description:
              "zh-CN": "分阶段知识代理上线（先权限内只读检索与强制引用，再对外口径 HITL）是否合理、可实现"
              "en-US": "Is the phased knowledge-agent rollout (entitled read retrieval with required citations first, then HITL on external copy) reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "度量体系明确性"
              "en-US": "Measurement Clarity"
            weight: 40
            description:
              "zh-CN": "引用质量、权限命中与一线采用的度量体系是否明确"
              "en-US": "Are citation quality, permission-hit, and frontline-adoption metrics clearly defined"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了编造引用、检索绕过权限、过期出处和一线继续问 Slack 等风险并制定了缓解计划"
              "en-US": "Are risks such as fabricated citations, retrieval that bypasses permissions, stale sources, and frontline Slack bypass identified with mitigation plans"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "知识负责人想先上线检索再补权限，而安全要求无权内容不得被引用、检索必须先过 ACL"
        "en-US": "The knowledge lead wants to ship retrieval first and add permissions later, while security requires that unauthorized content must not be quoted and retrieval must pass ACL first"
      expectedEvidenceIds: ["ev-constraints", "ev-business-impact"]
    - id: cc-002
      statement:
        "zh-CN": "知识库运营希望 wiki 成为可引用的权威出处，而一线更信 Slack 口口相传、不信过期页面"
        "en-US": "Knowledge-base ops wants the wiki to be the citable source of truth, while the frontline trusts tribal Slack and distrusts stale pages"
      expectedEvidenceIds: ["ev-trust", "ev-workflow"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "在谈知识代理之前，员工现在是按什么路径问到内部答案的？"
          "en-US": "Before proposing the knowledge agent, how do employees currently get to an internal answer?"
        "2":
          "zh-CN": "去找检索顺序、引用是不是检索带来的，以及一线今天实际找答案的方式。"
          "en-US": "Look for retrieval order, whether citations ride with the hit, and how the frontline actually finds answers today."
        "3":
          "zh-CN": "员工提问后，代理会按什么顺序使用文档索引、权限目录和 wiki/工单？一线现在主要靠什么途径问到答案？"
          "en-US": "After an employee asks, in what order does the agent use the document index, the permission directory, and wiki/tickets? How does the frontline mainly get answers today?"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "内部问不到答案，组织最疼的是哪一类摩擦？"
          "en-US": "When internal answers are hard to get, which kind of friction hurts the organization most?"
        "2":
          "zh-CN": "去找问询负担、不该命中的暴露，以及一线是否还在绕过知识库。"
          "en-US": "Look for asking-around burden, exposure of hits that should not have landed, and whether the frontline still bypasses the knowledge base."
        "3":
          "zh-CN": "员工今天要费多大劲才能问到内部业务答案？检索一旦碰到不该看的内容，一线和运营分别会看到什么？"
          "en-US": "How much effort does it take an employee to get an internal business answer today? If retrieval lands on something the asker should not see, what do the frontline and ops each observe?"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有检索卡住的是权限、新鲜度，还是索引本身？"
          "en-US": "Is current retrieval stuck on permissions, freshness, or the index itself?"
        "2":
          "zh-CN": "去找权限是否进检索路径、内容新鲜度闸门，以及引用从哪来。"
          "en-US": "Look for whether permissions sit on the retrieval path, whether a freshness gate exists, and where citations come from."
        "3":
          "zh-CN": "现网检索实际怎么过权限？wiki 有没有新鲜度控制？引用是检索命中带来的，还是事后补上的？"
          "en-US": "How does production retrieval actually pass permissions, is there a freshness control on the wiki, and do citations arrive with the hit or get added afterward?"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "错误内部答案和越权引用，分别打在客户口径还是审计上？"
          "en-US": "Do wrong internal answers and unauthorized quotes hit customer wording, audit, or both?"
        "2":
          "zh-CN": "去找口径不一致的业务代价，以及安全对一次越权引用的态度。"
          "en-US": "Look for the business cost of drifted wording and security's stance on a single unauthorized quote."
        "3":
          "zh-CN": "内部答案出错时，对外口径会怎样？一次越权引用会触发什么？知识负责人还想先上线吗？"
          "en-US": "When an internal answer is wrong, what happens to external wording? What does one unauthorized quote trigger? Does the knowledge lead still want to ship first?"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "权限和对外口径，分别被什么拦住？"
          "en-US": "What stops quoting on permissions versus what stops external wording from going out?"
        "2":
          "zh-CN": "去找不得引用的内容范围，以及对外口径要不要人工，文档能否出境。"
          "en-US": "Look for the scope of content that must not be quoted, whether external wording needs a human, and whether documents may leave the region."
        "3":
          "zh-CN": "员工无权阅读的内容能不能被引用？对外口径要不要经人工确认？内部文档和工单能不能送到境外模型？"
          "en-US": "May content the employee is not entitled to be quoted, must external customer-facing copy wait for a human, and may internal documents and tickets go to an offshore model?"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层用引用质量、权限还是一线习惯来宣布知识代理成功？"
          "en-US": "Will leadership call this knowledge agent a win on citation quality, permissions, or frontline habit?"
        "2":
          "zh-CN": "去找默认问询路径、引用抽查，以及检索过权限的质量红线。"
          "en-US": "Look for the default asking path, citation spot-checks, and the quality floor that retrieval must pass permissions."
        "3":
          "zh-CN": "怎样才算一线不再只靠口口相传？引用质量有没有抽查红线？检索必须先过哪一层权限？"
          "en-US": "What would it take for the frontline to stop relying only on word-of-mouth, is there a citation-quality floor from spot-checks, and which permission layer must retrieval pass first?"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "一线和安全对同一套知识代理，分别怕什么、信什么？"
          "en-US": "What do the frontline versus security fear or trust about the same knowledge agent?"
        "2":
          "zh-CN": "去找一线是否绕过知识库问人，以及安全对检索守权的预期。"
          "en-US": "Look for frontline workarounds that bypass the knowledge base and security's expectation that retrieval will honor permissions."
        "3":
          "zh-CN": "一线更信同事转述还是知识库代理？安全是否相信检索会守住权限？"
          "en-US": "Does the frontline trust colleague word-of-mouth or the knowledge-base agent more, and does security believe retrieval will honor permissions?"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "说错出处和把不该看的内容漏出去，哪种更可能把知识代理打穿？"
          "en-US": "Which failure punches through first: a wrong source, or leaking something the asker should not see?"
        "2":
          "zh-CN": "去找不确定时的胡编行为，以及检索不核对权限时回答会怎样。"
          "en-US": "Look for fabrication under uncertainty and what the answer looks like if retrieval does not check permissions."
        "3":
          "zh-CN": "模型没把握时会怎么给出处？检索如果没过权限，回答里会出现什么？"
          "en-US": "When the model is unsure, how does it give a source? If retrieval never passed permissions, what shows up in the answer?"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含文档索引/ACL/wiki 工单检索、无权内容不得引用与对外口径 HITL 的完整方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete plan with document-index/ACL/wiki-ticket retrieval, no quoting of unauthorized content, and HITL on external copy"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须面向管理层展示可量化的采用与审计收益，并化解一线绕过、编造引用与检索绕过权限等安全顾虑"
        "en-US": "In the PITCH phase, the learner must present quantifiable adoption and audit value to leadership and address frontline bypass, fabricated citations, and retrieval that bypasses permissions"

events:
  - id: event-iam-mandate
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【安全通知】安全与身份负责人宣布：员工无权阅读的内容一律禁止被代理引用，对外口径必须先经人工确认。"
      "en-US": "【Security Notice】The Security / IAM lead announces that content the employee is not entitled to is strictly forbidden from agent quotes, and external customer-facing copy must wait for human confirmation."
  - id: event-ship-first-pressure
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-business-impact
    prompt:
      "zh-CN": "【上线压力】知识与IT负责人要求：知识代理必须先上线检索，权限闸门可以下一阶段再补。"
      "en-US": "【Ship Pressure】The Head of Knowledge / IT requires the knowledge agent to ship retrieval first, with the permission gate allowed to wait for a later phase."
  - id: event-fabricated-citation
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【事故报告】知识库运营通报：代理曾编造引用，并且一次检索忽略了 ACL，把无权内容写进了回答。"
      "en-US": "【Incident Report】Knowledge-base ops reports that the agent fabricated a citation, and one retrieval ignored ACL and wrote unauthorized content into the answer."
  - id: event-citation-required
    trigger:
      kind: after_question_count
      count: 3
    prompt:
      "zh-CN": "【流程要求】知识库运营要求：每一次内部答案都必须带可打开的引用，对外口径不得由代理自行定稿。"
      "en-US": "【Process Required】Knowledge-base ops requires every internal answer to carry an openable citation, and external wording must not be finalized by the agent alone."
