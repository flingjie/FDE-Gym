id: data-migration
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们规划从遗留数据库向新数据平台的迁移方案，并控制迁移风险"
    "en-US": "Please help us plan the migration from our legacy database to a new data platform while controlling migration risk"
  visibleContext:
    "zh-CN": "我们是一家快速增长的零售企业。核心订单数据仍然运行在一个使用多年的遗留数据库上，公司决定将其迁移到新的数据平台，以支持未来的分析和AI应用。迁移必须在紧迫的时间表内完成，同时保证业务不中断、数据不出错。"
    "en-US": "We are a fast-growing retail company. Our core order data still runs on a legacy database that has been in use for many years. The company has decided to migrate it to a new data platform to support future analytics and AI applications. The migration must be completed on a tight timeline while keeping the business running and the data accurate."
  visibleConstraints:
    - "zh-CN": "上线窗口只有8周，且迁移必须在周末夜间进行"
      "en-US": "The go-live window is only 8 weeks, and migration must run on weekend nights"
    - "zh-CN": "预算有限，只能采购一套迁移工具并聘用两名合同工程师"
      "en-US": "Limited budget: only one migration tool and two contract engineers"
    - "zh-CN": "迁移期间业务不能中断，旧系统必须保持可读"
      "en-US": "Business must not be interrupted during migration; the old system must stay readable"
    - "zh-CN": "迁移结果必须满足监管对数据可审计性的要求"
      "en-US": "The migration result must satisfy regulatory requirements for data auditability"
  deliverables:
    - "zh-CN": "完整的迁移方案设计文档"
      "en-US": "Complete migration design document"
    - "zh-CN": "数据质量评估与治理计划"
      "en-US": "Data quality assessment and governance plan"
    - "zh-CN": "回滚与业务连续性方案"
      "en-US": "Rollback and business continuity plan"
    - "zh-CN": "迁移时间表与里程碑"
      "en-US": "Migration timeline and milestones"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解迁移现状"
      "en-US": "You have a budget of 12 questions to understand the migration's current state"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: project-manager
      role:
        "zh-CN": "项目经理"
        "en-US": "Project Manager"
      persona:
        "zh-CN": "38岁女性，负责迁移项目的进度与协调。极度关注时间表和里程碑，担心任何延期都会影响自己的绩效评估。"
        "en-US": "38-year-old female, responsible for the migration project's schedule and coordination. Extremely focused on timelines and milestones, worried any delay will affect her performance review."
      concerns:
        - "zh-CN": "能否在原定的8周内完成上线？"
          "en-US": "Can we go live within the original 8 weeks?"
        - "zh-CN": "各数据所有部门能否按时配合？"
          "en-US": "Will each data-owning department cooperate on time?"
        - "zh-CN": "如果延期，如何向高层解释？"
          "en-US": "How to explain to senior management if we slip?"
      blindSpots:
        - "zh-CN": "不了解数据质量问题的严重程度"
          "en-US": "Does not understand the severity of the data quality issues"
        - "zh-CN": "低估了回滚脚本的技术复杂度"
          "en-US": "Underestimates the technical complexity of the rollback script"
        - "zh-CN": "没有意识到数据所有权存在争议"
          "en-US": "Is unaware that data ownership is contested"
    - id: technical-lead
      role:
        "zh-CN": "技术负责人"
        "en-US": "Technical Lead"
      persona:
        "zh-CN": "42岁男性，负责遗留数据库的日常维护。对数据缺陷了如指掌，坚持认为在数据质量达标前不能安全切换。"
        "en-US": "42-year-old male, responsible for day-to-day legacy database maintenance. Knows the data defects intimately and insists cutover is not safe until data quality is acceptable."
      concerns:
        - "zh-CN": "迁移前如何验证数据完整性？"
          "en-US": "How do we verify data integrity before migration?"
        - "zh-CN": "回滚能否在2小时内完成？"
          "en-US": "Can the rollback complete within 2 hours?"
        - "zh-CN": "字段映射规则由谁来最终确认？"
          "en-US": "Who ultimately confirms the field-mapping rules?"
      blindSpots:
        - "zh-CN": "过于关注技术风险而忽视商业时间压力"
          "en-US": "Over-focuses on technical risk while ignoring commercial time pressure"
        - "zh-CN": "不了解高层对ROI和监管期限的焦虑"
          "en-US": "Does not understand leadership's anxiety about ROI and regulatory deadlines"
    - id: data-owner
      role:
        "zh-CN": "数据负责人"
        "en-US": "Data Owner"
      persona:
        "zh-CN": "45岁女性，名义上负责企业数据资产，但多个数据域的实际所有权分散在不同业务部门。对责任边界态度模糊，担心被追责。"
        "en-US": "45-year-old female, nominally responsible for enterprise data assets, but actual ownership of several data domains is split across business departments. Ambiguous about responsibility boundaries and worried about being held accountable."
      concerns:
        - "zh-CN": "哪些数据域由我负责，哪些不属于我？"
          "en-US": "Which data domains am I responsible for, and which are not mine?"
        - "zh-CN": "如果迁移出错，责任如何划分？"
          "en-US": "If the migration goes wrong, how is responsibility divided?"
        - "zh-CN": "是否有人愿意签署数据移交确认书？"
          "en-US": "Is anyone willing to sign the data handover confirmation?"
      blindSpots:
        - "zh-CN": "不了解字段缺失的具体分布"
          "en-US": "Does not know the specific distribution of missing fields"
        - "zh-CN": "低估了遗留系统缺少数据字典的影响"
          "en-US": "Underestimates the impact of the legacy system's missing data dictionary"
    - id: finance-director
      role:
        "zh-CN": "财务总监"
        "en-US": "Finance Director"
      persona:
        "zh-CN": "50岁男性，控制项目预算。强调每一笔支出都要有明确回报，反对超支，倾向压缩外部专家投入。"
        "en-US": "50-year-old male, controls the project budget. Emphasizes a clear return on every expense, opposes overspending, and favors cutting external expert spending."
      concerns:
        - "zh-CN": "迁移的总成本是否在预算内？"
          "en-US": "Is the total migration cost within budget?"
        - "zh-CN": "额外资源申请能否带来可量化的风险下降？"
          "en-US": "Do additional resource requests bring quantifiable risk reduction?"
        - "zh-CN": "迁移失败会导致多少财务损失？"
          "en-US": "How much financial loss would a failed migration cause?"
      blindSpots:
        - "zh-CN": "不理解数据治理需要专业人力投入"
          "en-US": "Does not understand that data governance needs professional staffing"
        - "zh-CN": "低估了数据错误带来的合规与声誉成本"
          "en-US": "Underestimates the compliance and reputational cost of data errors"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "迁移涉及约3,200万条订单记录和15张相互关联的数据表"
        "en-US": "The migration covers about 32 million order records across 15 interrelated tables"
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "数据所有权分散：订单数据归销售部，客户数据归市场部，库存数据归运营部，没有单一端到端负责人"
        "en-US": "Data ownership is fragmented: order data belongs to Sales, customer data to Marketing, inventory data to Operations — there is no single end-to-end owner"
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "迁移准备中的抽样验证发现约12%的记录存在字段缺失或格式不一致"
        "en-US": "Sampling during migration preparation found about 12% of records have missing fields or inconsistent formats"
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "团队每周要花两天时间手工核对数据，仍然不断发现新的异常"
        "en-US": "The team spends two days a week manually reconciling data, yet keeps finding new anomalies"
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "遗留数据库已有18年历史，经历过7次未记录在案的应急修改"
        "en-US": "The legacy database is 18 years old and has undergone 7 undocumented emergency changes"
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "系统缺少数据字典，字段含义依赖三位资深工程师的个人记忆，其中一位已于去年离职"
        "en-US": "There is no data dictionary; field meanings rely on the personal memory of three senior engineers, one of whom left last year"
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "如果迁移失败导致订单处理中断，每天的营收损失约为40万美元"
        "en-US": "If a failed migration interrupts order processing, the daily revenue loss is about $400,000"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "监管要求在下个财季前完成数据可审计性改造，逾期将面临合规处罚"
        "en-US": "Regulators require auditable data by next fiscal quarter; missing the deadline risks compliance penalties"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "上线窗口只有8周，且迁移必须在周末夜间进行以最小化停机"
        "en-US": "The go-live window is only 8 weeks, and migration must run on weekend nights to minimize downtime"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "预算只够一套迁移工具和两名合同工程师，无法聘请外部数据治理专家"
        "en-US": "The budget covers only one migration tool and two contract engineers; no budget for external data-governance experts"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "成功标准是99.99%的记录在切换后通过完整性校验，且回滚时间不超过2小时"
        "en-US": "Success means 99.99% of records pass integrity checks after cutover, with rollback under 2 hours"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "管理层希望迁移后订单查询延迟降低60%，为后续AI应用打下基础"
        "en-US": "Management wants order-query latency reduced by 60% after migration, laying the groundwork for future AI applications"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "项目经理坚持按原定8周上线，技术负责人认为数据质量不足以安全切换，两人公开争执"
        "en-US": "The project manager insists on the original 8-week go-live, while the technical lead believes data quality is not yet safe for cutover; they argue openly"
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "数据负责人担心被追究责任，对关键数据问题给出模糊回答"
        "en-US": "The data owner fears being held accountable and gives vague answers on critical data issues"
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "如果回滚脚本未能在2小时内生效，新旧系统会同时写入，造成难以修复的数据分叉"
        "en-US": "If the rollback script fails to take effect within 2 hours, old and new systems write simultaneously, causing hard-to-repair data divergence"
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "部分数据在迁移中可能被静默截断（字段超长），且现有校验逻辑不会报错"
        "en-US": "Some data may be silently truncated during migration (over-length fields), and the existing validation logic will not flag it"
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "迁移工作流与所有权信息：数据规模、表结构、责任归属"
        "en-US": "Migration workflow and ownership: data volume, table structure, responsibility"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "迁移痛点：数据质量差、人工核对耗时"
        "en-US": "Migration pain points: poor data quality, time-consuming manual reconciliation"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "数据质量不确定的根因：遗留系统陈旧、缺少数据字典"
        "en-US": "Root causes of data-quality uncertainty: aging legacy system, missing data dictionary"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：停机营收损失、合规处罚风险"
        "en-US": "Business impact: downtime revenue loss, compliance penalty risk"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：8周期限、预算有限、停机窗口"
        "en-US": "Implementation constraints: 8-week deadline, limited budget, downtime window"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：完整性校验通过率、回滚时间、查询延迟"
        "en-US": "Success metrics: integrity pass rate, rollback time, query latency"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任与分歧：项目经理与技术负责人的争执、数据负责人的回避"
        "en-US": "Trust and disagreement: PM vs technical-lead conflict, data owner's evasiveness"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：回滚失效导致数据分叉、静默截断"
        "en-US": "Failure modes: failed rollback causing divergence, silent truncation"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "迁移风险陈述清晰度"
              "en-US": "Migration Risk Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述迁移项目的数据质量风险与时间压力"
              "en-US": "Can accurately describe the migration's data-quality risk and time pressure"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了项目经理、技术负责人、数据负责人和财务总监及其核心关切"
              "en-US": "Has identified the PM, technical lead, data owner, finance director and their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（完整性、回滚时间、延迟）"
              "en-US": "Are measurable success criteria (integrity, rollback time, latency) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "迁移方案完整性"
              "en-US": "Migration Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖数据清理、映射、迁移、校验、切换的完整流程"
              "en-US": "Does the solution cover cleaning, mapping, migration, validation, and cutover"
          - id: s-c2
            label:
              "zh-CN": "与约束的兼容性"
              "en-US": "Constraint Compatibility"
            weight: 35
            description:
              "zh-CN": "方案是否在8周、预算和夜间窗口内可行"
              "en-US": "Is the solution feasible within 8 weeks, budget, and night windows"
          - id: s-c3
            label:
              "zh-CN": "回滚与业务连续性"
              "en-US": "Rollback and Continuity"
            weight: 25
            description:
              "zh-CN": "方案是否包含可执行的回滚与业务连续性措施"
              "en-US": "Does the solution include an executable rollback and business-continuity plan"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "分歧化解"
              "en-US": "Conflict Resolution"
            weight: 50
            description:
              "zh-CN": "能否有效调和项目经理与技术负责人关于上线时间的分歧"
              "en-US": "Can effectively reconcile the PM and technical lead over the go-live date"
          - id: ch-c2
            label:
              "zh-CN": "技术风险缓解"
              "en-US": "Technical Risk Mitigation"
            weight: 50
            description:
              "zh-CN": "是否提出了降低数据丢失与分叉风险的措施"
              "en-US": "Are measures proposed to reduce data-loss and divergence risk"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层信息适配"
              "en-US": "Senior Leadership Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向管理层关注的风险、合规和投资回报进行阐述"
              "en-US": "Does the presentation address leadership's risk, compliance, and ROI concerns"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "时间规划合理性"
              "en-US": "Timeline Reasonableness"
            weight: 30
            description:
              "zh-CN": "8周迁移计划是否合理、可实现"
              "en-US": "Is the 8-week migration plan reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "可交付成果明确性"
              "en-US": "Deliverable Clarity"
            weight: 40
            description:
              "zh-CN": "每个阶段的可交付成果是否明确、可验收"
              "en-US": "Are deliverables for each phase clearly defined and verifiable"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了关键风险并制定了缓解计划"
              "en-US": "Are key risks identified and mitigation plans established"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "项目经理要求按原定8周期限上线，而技术负责人坚持数据质量不足以在期限内安全切换"
        "en-US": "The project manager demands the original 8-week go-live, while the technical lead insists data quality is insufficient for a safe cutover within that timeline"
      expectedEvidenceIds: ["ev-trust", "ev-success-measures"]
    - id: cc-002
      statement:
        "zh-CN": "数据所有权分散在三个部门且无人愿意承担整体责任，但迁移需要端到端的数据负责人"
        "en-US": "Data ownership is split across three departments with no one willing to take overall responsibility, yet the migration needs an end-to-end data owner"
      expectedEvidenceIds: ["ev-workflow", "ev-root-cause"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "在谈迁移方案之前，数据现在有多大、又是谁在管？"
          "en-US": "Before proposing a migration, how large is the data and who actually owns it?"
        "2":
          "zh-CN": "去找记录规模、表之间的关联，以及是否存在单一端到端负责人。"
          "en-US": "Look for record volume, how tables relate, and whether there is a single end-to-end owner."
        "3":
          "zh-CN": "迁移覆盖大约多少记录、多少张相互关联的表？订单、客户、库存数据分别归谁，有没有单一负责人？"
          "en-US": "What volume of records and how many interrelated tables are in scope, and who owns order, customer, and inventory data — is there a single owner?"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "迁移准备里最疼的是数据质量，还是手工核对的负担？"
          "en-US": "Is preparation hurting most on data quality, or on manual reconciliation load?"
        "2":
          "zh-CN": "去找抽样里的字段缺失或不一致占比，以及每周手工核对占用的时间。"
          "en-US": "Look for the share of sampled records with missing or inconsistent fields, and how much weekly time goes to manual recon."
        "3":
          "zh-CN": "抽样验证里有多少记录字段缺失或格式不一致？团队每周手工核对要花多少时间，期间数据问题还会怎么冒出来？"
          "en-US": "What share of sampled records have missing fields or inconsistent formats, and how much of the week is spent reconciling by hand — how do new data issues show up during that work?"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "数据质量问题到底卡在系统年代、变更记录，还是字段定义？"
          "en-US": "Is the quality problem stuck on system age, change history, or field definitions?"
        "2":
          "zh-CN": "去找库龄、变更记录是否完整，以及字段含义有没有书面依据。"
          "en-US": "Look for database age, whether change history is complete, and whether field meanings have a written source."
        "3":
          "zh-CN": "遗留库用了多久、中间有过多少次没记下的应急修改？有没有数据字典，字段含义现在靠谁记得住？"
          "en-US": "How old is the legacy database, how many undocumented emergency changes has it seen, and is there a data dictionary — or do field meanings live in a few people's heads?"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "迁移失败打在每天营收上，还是打在监管期限上？"
          "en-US": "Does a failed migration hit daily revenue, the regulatory deadline, or both?"
        "2":
          "zh-CN": "去找订单中断的日损失量级，以及可审计性改造的监管截止压力。"
          "en-US": "Look for daily revenue at risk if orders stop, and the compliance deadline for auditable data."
        "3":
          "zh-CN": "如果订单处理因迁移中断，一天大概损失多少营收？监管对可审计数据的期限是什么，逾期会怎样？"
          "en-US": "What daily revenue is lost if order processing stops, and by when must data be auditable — what happens if that date is missed?"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "迁移在窗口长短、能停机的时段，以及能请多少人上，分别被什么拦住？"
          "en-US": "What stops the migration on calendar window, when it may run, and how many people can be hired?"
        "2":
          "zh-CN": "去找上线窗口长度、必须在何时切，以及工具和合同人力的预算上限。"
          "en-US": "Look for go-live window length, the allowed cutover hours, and the budget cap on tools and contract staff."
        "3":
          "zh-CN": "上线窗口还剩多久，迁移必须排在什么时段以压低停机？预算够几套工具、几名合同工程师，能不能请外部治理专家？"
          "en-US": "How long is the go-live window, when must cutover run to keep downtime down, how many tools and contract engineers does the budget cover, and is outside governance help in scope?"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层用完整性、回滚速度还是查询性能来宣布成功？"
          "en-US": "Will leadership call this a win on integrity, rollback speed, or query performance?"
        "2":
          "zh-CN": "去找切换后完整性通过率、回滚时限，以及查询延迟的改善目标。"
          "en-US": "Look for the post-cutover integrity pass rate, the rollback time limit, and the query-latency target."
        "3":
          "zh-CN": "切换后多少记录要通过完整性校验才算成功？回滚必须在多长时间内完成？查询延迟要改善到什么程度？"
          "en-US": "What share of records must pass integrity checks after cutover, how fast must rollback complete, and how much should order-query latency fall?"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "项目经理、技术负责人和数据负责人，对同一条上线线分别怕什么、坚持什么？"
          "en-US": "What do the project manager, technical lead, and data owner each fear or insist on for the same go-live?"
        "2":
          "zh-CN": "去找各方对上线窗口的立场是否一致，以及关键问题上回答的完整程度。"
          "en-US": "Look for whether go-live-window positions align, and how complete answers are on the hard questions."
        "3":
          "zh-CN": "项目经理还在不在坚持原定上线？技术负责人是否认为数据质量还不够安全？数据负责人会不会回避关键问题？"
          "en-US": "Does the project manager still insist on the original go-live, does the technical lead believe quality is unsafe for cutover, and does the data owner dodge hard questions?"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "迁移失手时，该先从时效、完整性还是可观测性去想失败怎么打穿？"
          "en-US": "If the migration fails, should you first think along timing, integrity, or observability?"
        "2":
          "zh-CN": "去找回滚超时的影响，以及超长字段是否被现有校验覆盖。"
          "en-US": "Look for rollback-timeout effects, and whether over-length fields are caught by current validation."
        "3":
          "zh-CN": "回滚如果不能及时生效，数据侧会出现什么？超长字段在迁移时会怎样处理，现有校验能不能抓住？"
          "en-US": "If rollback does not take effect in time, what happens on the data side? What happens to over-length fields during migration, and does current validation catch them?"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含回滚与业务连续性措施的完整迁移方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete migration plan with rollback and business-continuity measures"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须成功化解上线时间分歧并展示方案价值"
        "en-US": "In the PITCH phase, the learner must successfully resolve the go-live disagreement and demonstrate value"

events:
  - id: event-timeline-pressure
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【时间压力】CEO通知：由于年度预算规划，迁移上线日期被提前两周，现在只剩6周时间。"
      "en-US": "【Timeline Pressure】The CEO announces that, due to annual budget planning, the migration go-live has been pulled in by two weeks — only 6 weeks remain."
  - id: event-budget-freeze
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-pain
    prompt:
      "zh-CN": "【预算冻结】财务总监通知：超出已批预算的额外资源申请一律暂停，需要重新证明必要性。"
      "en-US": "【Budget Freeze】The Finance Director announces that all additional resource requests beyond the approved budget are suspended until necessity is re-proven."
  - id: event-ownership-gap
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-workflow
    prompt:
      "zh-CN": "【组织缺口】运营副总裁通知：数据负责人临时休假，端到端的数据责任暂时悬空。"
      "en-US": "【Ownership Gap】The VP of Operations announces that the data owner is on leave, leaving end-to-end data responsibility temporarily vacant."
  - id: event-rollback-demand
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【回滚要求】CTO要求：在批准切换前，必须提交一次完整的回滚演练记录。"
      "en-US": "【Rollback Requirement】The CTO requires a full rollback-drill record before approving cutover."
