id: software-engineering-agent
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们设计一个软件工程代理，在隔离沙箱里修 Bug、跑测试并开 PR，同时守住受保护分支和生产密钥。"
    "en-US": "Please help us design a software-engineering agent that fixes bugs, runs tests, and opens PRs inside an isolated sandbox, while protecting protected branches and production secrets."
  visibleContext:
    "zh-CN": "我们是一家产品工程团队。管理层希望代理在隔离沙箱里改代码、跑测试、经 PR 接口开评审，而不是让代理直接碰默认分支或生产密钥。"
    "en-US": "We are a product engineering team. Leadership wants an agent that edits code, runs tests, and opens reviews through the PR API inside an isolated sandbox — not an agent that touches the default branch or production secrets."
  visibleConstraints:
    - "zh-CN": "受保护分支合并与生产密钥使用必须先经人工确认（HITL）；禁止直接 push 默认分支"
      "en-US": "Merges to protected branches and any use of production secrets require a human (HITL); pushing the default branch is forbidden"
    - "zh-CN": "生产密钥不得进入沙箱、PR 描述或 diff"
      "en-US": "Production secrets must not enter the sandbox, the PR description, or the diff"
    - "zh-CN": "代理不得在测试已绿时把行为回归当成成功"
      "en-US": "The agent must not treat a behavior regression as success just because tests are green"
    - "zh-CN": "允许调用的工具是 Git、隔离沙箱、测试运行器和 PR 接口；代理不得把秘密写进 PR"
      "en-US": "Allowed tools are Git, an isolated sandbox, the test runner, and the PR API; the agent must not write a secret into a PR"
  deliverables:
    - "zh-CN": "软件工程代理方案设计文档"
      "en-US": "Software-engineering agent design document"
    - "zh-CN": "沙箱修 Bug 与人工改仓库的权衡分析"
      "en-US": "Sandbox bug-fix vs. human-only repo-edit trade-off analysis"
    - "zh-CN": "受保护分支合并与生产密钥的人工确认（HITL）流程"
      "en-US": "Human-in-the-loop (HITL) process for protected-branch merges and production secrets"
    - "zh-CN": "绿测质量、秘密泄漏与发布窗口的度量体系"
      "en-US": "Green-test quality, secret-leak, and release-window measurement framework"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解这家客户的工程代理现状"
      "en-US": "You have a budget of 12 questions to understand this customer's engineering-agent situation"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: eng-manager
      role:
        "zh-CN": "工程经理"
        "en-US": "Engineering manager"
      persona:
        "zh-CN": "47岁男性，负责工程吞吐。希望代理清 Bug 积压、跑测试并开 PR，又时常把测试已绿当成可以合并。"
        "en-US": "47-year-old male, owns engineering throughput. Wants the agent to clear the bug backlog, run tests, and open PRs, and often treats green tests as ready to merge."
      concerns:
        - "zh-CN": "代理能不能真的缩短修 Bug 到开 PR 的周期？"
          "en-US": "Can the agent actually shorten the cycle from bug-fix to opening a PR?"
        - "zh-CN": "测试绿了是不是就可以合？"
          "en-US": "If tests are green, can we merge?"
        - "zh-CN": "IC 不让代理碰仓库时吞吐还怎么上去？"
          "en-US": "How does throughput rise if ICs will not let the agent touch their repo?"
      blindSpots:
        - "zh-CN": "不了解平台安全要把生产密钥彻底隔离"
          "en-US": "Does not know platform security wants production secrets fully isolated"
        - "zh-CN": "低估了绿测仍被撤回对发布窗口的伤害"
          "en-US": "Underestimates how green-then-reverted PRs hurt the release window"
    - id: platform-security
      role:
        "zh-CN": "平台与安全负责人"
        "en-US": "Platform / security lead"
      persona:
        "zh-CN": "51岁女性，负责平台与密钥。坚持受保护分支合并和生产密钥必须人工，禁止 push 默认分支，对秘密进 PR 零容忍。"
        "en-US": "51-year-old female, owns platform and secrets. Insists protected-branch merges and production-secret use need a human, forbids pushing the default branch, and has zero tolerance for secrets in a PR."
      concerns:
        - "zh-CN": "沙箱会不会读到生产密钥？"
          "en-US": "Could the sandbox read a production secret?"
        - "zh-CN": "PR 描述或 diff 会不会带出密钥？"
          "en-US": "Could a PR description or diff leak a secret?"
        - "zh-CN": "代理会不会直接 push 默认分支？"
          "en-US": "Could the agent push the default branch directly?"
      blindSpots:
        - "zh-CN": "不了解工程经理要用代理清 Bug 积压"
          "en-US": "Does not understand the eng manager is using the agent to clear the bug backlog"
        - "zh-CN": "低估了测试只锁接口时行为仍会偏"
          "en-US": "Underestimates that tests locking only the old interface still let behavior drift"
    - id: ic-developer
      role:
        "zh-CN": "一线开发"
        "en-US": "IC developer"
      persona:
        "zh-CN": "32岁男性，IC。不信任代理动自己的仓库，仍手写补丁，担心代理改错行为却把测试跑绿。"
        "en-US": "32-year-old male, IC. Does not trust the agent to touch his repo, still writes patches by hand, and fears the agent will change the wrong behavior while leaving tests green."
      concerns:
        - "zh-CN": "代理会不会在我不知情时改我的分支？"
          "en-US": "Will the agent change my branch without me knowing?"
        - "zh-CN": "它改完我还要不要整页重审？"
          "en-US": "After it edits, do I still have to re-review the whole page?"
        - "zh-CN": "测试绿了，行为是不是还是错的？"
          "en-US": "If tests are green, can the behavior still be wrong?"
      blindSpots:
        - "zh-CN": "不了解受保护分支合并必须人工"
          "en-US": "Does not know protected-branch merges require a human"
        - "zh-CN": "看不到平台对密钥进 PR 的事故记录"
          "en-US": "Cannot see the platform's incident record of a secret entering a PR"
    - id: qa-lead
      role:
        "zh-CN": "质量负责人"
        "en-US": "QA lead"
      persona:
        "zh-CN": "40岁女性，负责质量。关心绿测是否锁住行为，担心代理只把旧断言跑绿，发布后再被撤回。"
        "en-US": "40-year-old female, owns quality. Cares whether green tests lock behavior, and fears the agent will only green the old assertions and get reverted after release."
      concerns:
        - "zh-CN": "现有测试锁住的是接口还是行为？"
          "en-US": "Do current tests lock the interface or the behavior?"
        - "zh-CN": "代理开的 PR 要不要额外的行为验收？"
          "en-US": "Do agent-opened PRs need extra behavior acceptance?"
        - "zh-CN": "撤回会不会把发布窗口打乱？"
          "en-US": "Will reverts scramble the release window?"
      blindSpots:
        - "zh-CN": "不了解沙箱仍可能读到生产密钥"
          "en-US": "Does not know the sandbox may still read a production secret"
        - "zh-CN": "低估了工程经理会把绿测当成合并许可"
          "en-US": "Underestimates that the eng manager will treat green tests as merge permission"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "代理在隔离沙箱里拉 Git 分支、改代码、跑测试，再经 PR 接口开 PR。"
        "en-US": "The agent pulls a Git branch in an isolated sandbox, edits code, runs tests, then opens a PR through the PR API."
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "默认分支禁止直接 push；合并受保护分支必须人工。"
        "en-US": "Pushing the default branch is forbidden; merging a protected branch requires a human."
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "约15%绿测 PR 被 revert。"
        "en-US": "About 15% of green-test PRs are reverted."
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "工程师不信任代理动自己的仓库；评审排队变长。"
        "en-US": "Engineers do not trust the agent to touch their repo; the review queue grows."
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "测试套件只断言旧接口，改错行为也能绿。"
        "en-US": "The test suite only asserts the old interface, so wrong behavior can still go green."
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "沙箱仍能读到生产密钥；PR 描述会回显环境变量。"
        "en-US": "The sandbox can still read production secrets; the PR description echoes environment variables."
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "一次 revert 会打乱发布窗口；安全认为一次密钥进 PR 就要轮换。"
        "en-US": "One revert scrambles the release window; security believes one secret in a PR forces a rotation."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "工程经理想用代理清 Bug 积压；平台安全要先锁权限。"
        "en-US": "The eng manager wants the agent to clear the bug backlog; platform security wants permissions locked first."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "受保护分支合并和生产密钥使用必须人工；禁止 push 默认分支。"
        "en-US": "Merges to protected branches and production-secret use require a human; pushing the default branch is forbidden."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "生产密钥不得进入沙箱或 PR。"
        "en-US": "Production secrets must not enter the sandbox or a PR."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "目标：沙箱内修 Bug、跑测试、开 PR 成为默认路径。"
        "en-US": "Goal: fixing bugs, running tests, and opening PRs inside the sandbox becomes the default path."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "质量红线：绿测不得掩盖行为回归；PR 中不得出现秘密。"
        "en-US": "Quality floor: green tests must not hide a behavior regression; a secret must not appear in a PR."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "IC 不让代理碰自己的仓库，仍手写补丁。"
        "en-US": "The IC will not let the agent touch their repo and still writes patches by hand."
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "工程经理以为测试绿就可以合；QA 低估行为回归。"
        "en-US": "The eng manager thinks green tests mean merge; QA underestimates behavior regressions."
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "测试绿但改错了行为。"
        "en-US": "Tests are green but the behavior is wrong."
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "曾有一次把 token 写进 PR 描述。"
        "en-US": "There was one incident of a token written into a PR description."
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "工程代理路径（沙箱内 Git、改代码、测试运行器、PR 接口）、默认分支禁止直接 push、受保护分支合并须人工"
        "en-US": "Engineering-agent path (Git, edits, test runner, and PR API inside the sandbox), no direct push to the default branch, human required to merge a protected branch"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "工程痛点：绿测仍被撤回、工程师不让代理碰仓库、评审排队变长"
        "en-US": "Engineering pain: green tests still reverted, engineers block the agent from their repo, the review queue grows"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "测试只断言旧接口所以改错行为也能绿；沙箱仍能读到生产密钥；PR 描述会回显环境变量"
        "en-US": "Tests only assert the old interface so wrong behavior can still go green; the sandbox can still read production secrets; the PR description echoes environment variables"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：撤回打乱发布窗口、密钥进 PR 就要轮换、工程经理想先清积压而平台安全要先锁权限"
        "en-US": "Business impact: a revert scrambles the release window, a secret in a PR forces rotation, the eng manager wants the backlog cleared first while platform security wants permissions locked first"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：受保护分支合并与生产密钥使用须人工、禁止 push 默认分支，生产密钥不得进入沙箱或 PR"
        "en-US": "Implementation constraints: human required for protected-branch merges and production-secret use, no push to the default branch, production secrets must not enter the sandbox or a PR"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：沙箱内修 Bug、跑测试、开 PR 成为默认路径；绿测不得掩盖行为回归；PR 中不得出现秘密"
        "en-US": "Success metrics: sandbox bug-fix, test, and PR as the default path; green tests must not hide a behavior regression; a secret must not appear in a PR"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：IC 绕过代理手写补丁，工程经理把绿测当成合并许可，QA 低估行为回归"
        "en-US": "Trust issues: the IC bypasses the agent with hand-written patches; the eng manager treats green tests as merge permission; QA underestimates behavior regressions"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：测试已绿但行为被改错；秘密被写进 PR 描述"
        "en-US": "Failure modes: tests green on the wrong behavior; a secret written into a PR description"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "工程代理问题陈述清晰度"
              "en-US": "Engineering-Agent Problem Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述需要沙箱内修 Bug、跑测试、开 PR 的工程代理，而不是让代理直接碰默认分支"
              "en-US": "Can accurately describe why the team needs a sandbox agent that fixes bugs, runs tests, and opens PRs, not an agent that touches the default branch"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了工程经理、平台安全、一线开发和质量负责人及其核心关切"
              "en-US": "Has identified the eng manager, platform security, IC developer, and QA lead with their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（沙箱默认路径、绿测不得掩盖回归、PR 中不得出现秘密）"
              "en-US": "Are measurable success criteria (sandbox default path, green tests must not hide regressions, no secrets in a PR) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖 Git/沙箱/测试/PR 接口、受保护分支与密钥 HITL、绿测掩盖回归与秘密进 PR 的处理"
              "en-US": "Does the solution cover Git/sandbox/tests/PR API, HITL on protected branches and secrets, and handling of green-on-wrong-behavior plus secrets in a PR"
          - id: s-c2
            label:
              "zh-CN": "沙箱代理与人工改仓的权衡"
              "en-US": "Sandbox Agent vs. Human-only Edit Trade-off"
            weight: 35
            description:
              "zh-CN": "方案是否清晰地权衡了隔离沙箱里的工程代理与只允许人改仓库"
              "en-US": "Does the solution clearly weigh a sandbox engineering agent against human-only repo edits"
          - id: s-c3
            label:
              "zh-CN": "密钥与 HITL 兼容性"
              "en-US": "Secret and HITL Compatibility"
            weight: 25
            description:
              "zh-CN": "方案是否在受保护分支合并、生产密钥使用必须人工、禁止 push 默认分支的限制内可行"
              "en-US": "Is the solution feasible within HITL on protected-branch merges and production secrets, and no push to the default branch"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "绿测错行为与秘密进 PR 应对"
              "en-US": "Green-wrong-behavior and Secret-in-PR Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对测试已绿但行为被改错、以及秘密写进 PR 等不安全自动化"
              "en-US": "Can effectively address unsafe automation such as green tests on the wrong behavior and a secret written into a PR"
          - id: ch-c2
            label:
              "zh-CN": "受保护分支与密钥升级应对"
              "en-US": "Protected-branch and Secret Escalation Response"
            weight: 50
            description:
              "zh-CN": "是否建立了受保护分支合并与生产密钥使用必须人工、默认分支不得被直接 push 的升级通道"
              "en-US": "Has a reliable path been established so protected-branch merges and production-secret use wait for a human, and the default branch cannot be pushed"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层吞吐与安全适配"
              "en-US": "Executive Throughput and Security Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向工程经理的清积压压力与平台安全的密钥关切进行阐述，同时承认 HITL 会限制全自动合并"
              "en-US": "Does the presentation address the eng manager's backlog pressure and platform security's secret concerns while acknowledging HITL limits fully automatic merges"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "分阶段上线合理性"
              "en-US": "Phased Rollout Reasonableness"
            weight: 30
            description:
              "zh-CN": "分阶段工程代理上线（先沙箱只读检查与开 PR，再 HITL 合并）是否合理、可实现"
              "en-US": "Is the phased engineering-agent rollout (sandbox read checks and opening PRs first, then HITL merges) reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "度量体系明确性"
              "en-US": "Measurement Clarity"
            weight: 40
            description:
              "zh-CN": "绿测质量、秘密泄漏与发布窗口的度量体系是否明确"
              "en-US": "Are green-test quality, secret-leak, and release-window metrics clearly defined"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了绿测掩盖回归、秘密进 PR、直接 push 默认分支和 IC 绕过等风险并制定了缓解计划"
              "en-US": "Are risks such as green tests hiding regressions, secrets in a PR, pushing the default branch, and IC bypass identified with mitigation plans"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "工程经理想用代理清 Bug 积压并在测试绿后合并，而平台安全要求受保护分支合并与生产密钥使用必须人工"
        "en-US": "The eng manager wants the agent to clear the bug backlog and merge after green tests, while platform security requires a human for protected-branch merges and production-secret use"
      expectedEvidenceIds: ["ev-constraints", "ev-business-impact"]
    - id: cc-002
      statement:
        "zh-CN": "工程经理把绿测当成合并许可，而 IC 不让代理碰仓库、QA 担心测试只锁旧接口"
        "en-US": "The eng manager treats green tests as merge permission, while the IC will not let the agent touch the repo and QA fears tests only lock the old interface"
      expectedEvidenceIds: ["ev-trust", "ev-root-cause"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "在谈编码代理之前，改动现在是按什么顺序从仓库走到评审的？"
          "en-US": "Before proposing the coding agent, in what order does a change currently move from the repo to review?"
        "2":
          "zh-CN": "去找 Git、沙箱、测试和开 PR 的顺序，以及默认分支和受保护分支怎么被守住。"
          "en-US": "Look for the order of Git, sandbox, tests, and opening a PR, and how the default and protected branches are held."
        "3":
          "zh-CN": "代理修 Bug 时会按什么顺序用 Git、沙箱、测试运行器和 PR 接口？默认分支和受保护分支现在分别怎么处理？"
          "en-US": "When the agent fixes a bug, in what order does it use Git, the sandbox, the test runner, and the PR API? How are the default branch and protected branches handled today?"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "编码代理现在最疼的是返工、评审负担，还是仓库信任？"
          "en-US": "Is the coding agent hurting most on rework, review load, or repo trust?"
        "2":
          "zh-CN": "去找绿测仍被撤回的情况、工程师是否放手，以及评审排队。"
          "en-US": "Look for green tests that still get reverted, whether engineers let go of the repo, and the review queue."
        "3":
          "zh-CN": "测试已经绿的 PR 后来有多少会被撤回？工程师愿不愿意让代理动自己的仓库？"
          "en-US": "How often do already-green PRs still get reverted later, and are engineers willing to let the agent touch their repo?"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有代理卡住的是测试有效性、密钥边界，还是仓库权限？"
          "en-US": "Is the current agent stuck on test effectiveness, secret boundaries, or repo permissions?"
        "2":
          "zh-CN": "去找测试断言覆盖的是什么、沙箱能读到什么、PR 文本会回显什么。"
          "en-US": "Look for what test assertions actually cover, what the sandbox can read, and what PR text echoes."
        "3":
          "zh-CN": "现有测试实际锁住的是接口还是行为？沙箱里能碰到哪些密钥？开 PR 时描述里会出现什么？"
          "en-US": "Do current tests actually lock the interface or the behavior, what secrets can the sandbox reach, and what shows up in the description when a PR is opened?"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "合错变更和密钥进评审，分别打在发布还是安全响应上？"
          "en-US": "Do a bad merge and a secret in review hit the release, the security response, or both?"
        "2":
          "zh-CN": "去找撤回对发布窗口的影响，以及密钥一旦进 PR 要做什么。"
          "en-US": "Look for how a revert hits the release window and what must happen if a secret enters a PR."
        "3":
          "zh-CN": "一次撤回会怎样打乱发布？密钥如果出现在 PR 里，安全要怎么收场？工程经理还想先用代理清积压吗？"
          "en-US": "How does one revert scramble the release, what must security do if a secret appears in a PR, and does the eng manager still want the agent to clear the backlog first?"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "合并、密钥和默认分支，分别被什么拦住？"
          "en-US": "What stops a merge versus secret use versus a push to the default branch?"
        "2":
          "zh-CN": "去找必须人工的合并与密钥使用，以及默认分支能不能被直接 push。"
          "en-US": "Look for merges and secret uses that require a human, and whether the default branch can be pushed directly."
        "3":
          "zh-CN": "受保护分支合并和生产密钥使用要不要人工？默认分支能不能被直接 push？生产密钥能不能进沙箱或 PR？"
          "en-US": "Must protected-branch merges and production-secret use wait for a human, may the default branch be pushed directly, and may production secrets enter the sandbox or a PR?"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层用清 Bug 速度、回归质量还是密钥干净来宣布编码代理成功？"
          "en-US": "Will leadership call this coding agent a win on bug-clearing speed, regression quality, or clean secrets?"
        "2":
          "zh-CN": "去找沙箱修 Bug 是否成为默认路径，以及绿测和行为、PR 文本里的秘密这类红线。"
          "en-US": "Look for whether sandbox bug-fixes are the default path, and the floors around green tests versus behavior and secrets in PR text."
        "3":
          "zh-CN": "怎样才算修 Bug、跑测试、开 PR 成为默认路径？绿测能不能代替行为确认？PR 里能不能出现秘密？"
          "en-US": "What would make fix-test-and-open-PR the default path, may a green test replace behavior confirmation, and may a secret appear in a PR?"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "IC、经理和 QA 对同一套编码代理，分别怕什么、盼什么？"
          "en-US": "What do the IC, the manager, and QA fear or expect from the same coding agent?"
        "2":
          "zh-CN": "去找 IC 是否绕过代理手写补丁，以及经理对绿测即可合并的预期。"
          "en-US": "Look for IC workarounds that bypass the agent with hand-written patches and the manager's expectation that green tests mean merge."
        "3":
          "zh-CN": "IC 会不会不让代理碰自己的仓库？经理和 QA 对绿测与行为回归分别怎么看？"
          "en-US": "Will the IC refuse to let the agent touch their repo, and how do the manager and QA each view green tests versus behavior regressions?"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "测过但行为不对，和秘密进到评审文本，哪种更可能把编码代理打穿？"
          "en-US": "Which failure punches through first: tests that pass on the wrong behavior, or a secret that reaches review text?"
        "2":
          "zh-CN": "去找绿测仍被撤回时改了什么，以及秘密如何出现在 PR 文本里。"
          "en-US": "Look for what changed when a green test was still reverted, and how a secret shows up in PR text."
        "3":
          "zh-CN": "测试已经绿的时候，行为还可能怎样偏掉？开 PR 时描述或 diff 里曾出现过什么不该出现的东西？"
          "en-US": "When tests are already green, how can behavior still drift? What that should not have appeared has shown up in a PR description or diff?"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含 Git/沙箱/测试/PR 接口、受保护分支与密钥 HITL、以及绿测错行为与秘密进 PR 处理的完整方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete plan with Git/sandbox/tests/PR API, HITL on protected branches and secrets, and handling of green-on-wrong-behavior plus secrets in a PR"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须面向管理层展示可量化的吞吐收益，并化解绿测掩盖回归、秘密进 PR 与 IC 绕过等安全顾虑"
        "en-US": "In the PITCH phase, the learner must present quantifiable throughput value to leadership and address green tests hiding regressions, secrets in a PR, and IC bypass"

events:
  - id: event-security-mandate
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【安全通知】平台与安全负责人宣布：受保护分支合并与生产密钥使用一律禁止代理自行执行，必须先经人工确认，默认分支不得被直接 push。"
      "en-US": "【Security Notice】Platform / security announces that protected-branch merges and production-secret use are strictly forbidden from agent self-execution and must wait for a human, and the default branch must not be pushed."
  - id: event-backlog-pressure
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-business-impact
    prompt:
      "zh-CN": "【吞吐压力】工程经理要求：代理必须先清 Bug 积压并在测试绿后开 PR，受保护分支的人工合并可以后补。"
      "en-US": "【Throughput Pressure】The eng manager requires the agent to clear the bug backlog and open PRs after green tests first, with human merges to protected branches allowed to wait."
  - id: event-secret-in-pr
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【事故报告】质量负责人通报：一套测试已经绿的改动改错了行为，并且一次开 PR 时把密钥写进了描述。"
      "en-US": "【Incident Report】The QA lead reports that a green-test change altered the wrong behavior, and one opened PR wrote a secret into the description."
  - id: event-protected-branch
    trigger:
      kind: after_question_count
      count: 3
    prompt:
      "zh-CN": "【流程要求】平台安全要求：每一个代理开出的 PR 都必须保留人工合并通道，生产密钥不得出现在沙箱或评审文本，测试绿不得被当成行为正确。"
      "en-US": "【Process Required】Platform security requires every agent-opened PR to keep a human merge path, production secrets must not appear in the sandbox or review text, and a green test must not count as correct behavior."
