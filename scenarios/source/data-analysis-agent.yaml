id: data-analysis-agent
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们设计一个只读的数据分析代理，让业务人员用自然语言问数仓，并在写库和跨部门宽表上保留人工。"
    "en-US": "Please help us design a read-only data-analysis agent so business users can ask the warehouse in natural language, while keeping humans on warehouse writes and cross-department wide tables."
  visibleContext:
    "zh-CN": "我们是一家业务团队会自己取数的公司。管理层希望业务人员能用自然语言问数仓，代理只生成只读 SQL、走 BI 语义层并套行级安全，而不是再做一个迁库项目。"
    "en-US": "We are a company whose business teams pull their own numbers. Leadership wants business users to ask the warehouse in natural language. The agent should emit read-only SQL, use the BI semantic layer, and apply row-level security — not become another database-migration project."
  visibleConstraints:
    - "zh-CN": "代理禁止写数仓；跨部门宽表必须先经人工批准（HITL）"
      "en-US": "The agent must not write the warehouse; cross-department wide tables need human approval (HITL)"
    - "zh-CN": "查询结果中的个人数据不得带出受控分析环境"
      "en-US": "Personal data in query results must not leave the controlled analytics environment"
    - "zh-CN": "代理不得在语义层未覆盖时裸拼关联"
      "en-US": "The agent must not freely compose joins when the semantic layer does not cover the metric"
    - "zh-CN": "允许调用的工具是只读 SQL、BI 语义层和行级安全；代理不得丢掉过滤条件打出明细"
      "en-US": "Allowed tools are read-only SQL, the BI semantic layer, and row-level security; the agent must not drop filters and dump detail rows"
  deliverables:
    - "zh-CN": "数据分析代理方案设计文档"
      "en-US": "Data-analysis agent design document"
    - "zh-CN": "文本转 SQL 与语义层守门的权衡分析"
      "en-US": "Text-to-SQL vs. semantic-layer-guardrail trade-off analysis"
    - "zh-CN": "禁止写库与跨部门宽表批准（HITL）流程"
      "en-US": "No-write and cross-department wide-table approval (HITL) process"
    - "zh-CN": "查询安全、语义覆盖与业务自助的度量体系"
      "en-US": "Query-safety, semantic-coverage, and business-self-serve measurement framework"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解这家客户的问数代理现状"
      "en-US": "You have a budget of 12 questions to understand this customer's analysis-agent situation"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: analytics-lead
      role:
        "zh-CN": "分析负责人"
        "en-US": "Analytics lead"
      persona:
        "zh-CN": "42岁女性，负责分析团队。希望业务用自然语言自助问数，少找分析师搬数，又时常低估错误关联和漏过滤的风险。"
        "en-US": "42-year-old female, owns the analytics team. Wants business users to ask in natural language and stop tapping analysts for pulls, and often underestimates the risk of a wrong join or a dropped filter."
      concerns:
        - "zh-CN": "业务能不能用自然语言问到可信的指标？"
          "en-US": "Can the business get trustworthy metrics in natural language?"
        - "zh-CN": "语义层盖不住的指标，代理会不会乱拼查询？"
          "en-US": "If the semantic layer does not cover a metric, will the agent invent a query?"
        - "zh-CN": "如何减少分析师当取数窗口的时间？"
          "en-US": "How do we stop analysts from being a human extract window?"
      blindSpots:
        - "zh-CN": "不了解隐私官对一次明细泄漏的零容忍"
          "en-US": "Does not know the privacy officer has zero tolerance for one detail-row leak"
        - "zh-CN": "低估了业务会把结果直接贴进幻灯片"
          "en-US": "Underestimates that requesters will paste results straight into slides"
    - id: platform-dba
      role:
        "zh-CN": "数据平台与库负责人"
        "en-US": "Data-platform / DBA"
      persona:
        "zh-CN": "48岁男性，负责数仓与平台。坚持代理只能发只读 SQL，跨部门宽表必须批准，对文本转 SQL 直接打宽表持审慎态度。"
        "en-US": "48-year-old male, owns the warehouse and platform. Insists the agent may only issue read-only SQL, cross-department wide tables need approval, and is cautious about text-to-SQL hitting wide tables directly."
      concerns:
        - "zh-CN": "代理会不会写出带副作用的语句？"
          "en-US": "Could the agent emit a statement with side effects?"
        - "zh-CN": "宽表裸查会不会打穿平台负载？"
          "en-US": "Will bare queries against wide tables crush platform load?"
        - "zh-CN": "行级安全是不是每条查询都套上？"
          "en-US": "Is row-level security applied on every query?"
      blindSpots:
        - "zh-CN": "不了解业务贴幻灯片的速度压力"
          "en-US": "Does not understand the slide-deadline pressure on the business"
        - "zh-CN": "低估了语义层缺口会把代理逼去裸写 SQL"
          "en-US": "Underestimates that semantic-layer gaps push the agent to write raw SQL"
    - id: business-requester
      role:
        "zh-CN": "业务请求方"
        "en-US": "Business requester"
      persona:
        "zh-CN": "35岁男性，业务方。会把查询结果直接贴进幻灯片，嫌审批慢，更想直接问宽表。"
        "en-US": "35-year-old male, business requester. Pastes query results straight into slides, dislikes approval latency, and would rather ask a wide table directly."
      concerns:
        - "zh-CN": "我能不能当天拿到能上会的数？"
          "en-US": "Can I get numbers I can take to a meeting the same day?"
        - "zh-CN": "语义层没有的口径，我还能不能问？"
          "en-US": "If the semantic layer has no definition, can I still ask?"
        - "zh-CN": "审批会不会把问数拖到下周？"
          "en-US": "Will approval push the ask into next week?"
      blindSpots:
        - "zh-CN": "不了解漏过滤会打出个人字段"
          "en-US": "Does not know a dropped filter can surface personal fields"
        - "zh-CN": "看不到平台对写库和宽表的硬闸门"
          "en-US": "Cannot see the platform's hard gate on writes and wide tables"
    - id: privacy-officer
      role:
        "zh-CN": "隐私负责人"
        "en-US": "Privacy officer"
      persona:
        "zh-CN": "53岁女性，负责隐私与数据使用。坚持禁止写库、宽表要批准，对错关联或漏过滤打出个人字段零容忍。"
        "en-US": "53-year-old female, owns privacy and data use. Insists on no warehouse writes and approval for wide tables, and has zero tolerance for a wrong join or dropped filter that returns personal fields."
      concerns:
        - "zh-CN": "自然语言查询会不会漏掉过滤打出个人字段？"
          "en-US": "Could a natural-language query drop a filter and return personal fields?"
        - "zh-CN": "结果会不会被贴到不受控的幻灯片里？"
          "en-US": "Will results be pasted into uncontrolled slide decks?"
        - "zh-CN": "如何审计每一条生成的 SQL？"
          "en-US": "How do we audit every generated SQL statement?"
      blindSpots:
        - "zh-CN": "不了解分析负责人要用自助问数换回分析师时间"
          "en-US": "Does not understand the analytics lead is trading self-serve asks for analyst time"
        - "zh-CN": "低估了语义层覆盖不足时业务会施压绕过"
          "en-US": "Underestimates that thin semantic coverage lets the business pressure a bypass"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "业务人员用自然语言问数仓；代理先走 BI 语义层再生成只读 SQL。"
        "en-US": "Business users ask the warehouse in natural language; the agent hits the BI semantic layer first, then emits read-only SQL."
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "行级安全本应套在每条查询上；跨部门宽表要另走批准。"
        "en-US": "Row-level security is supposed to wrap every query; cross-department wide tables take a separate approval path."
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: pain
      text:
        "zh-CN": "一次错误查询曾打出约2.4万行含手机号。"
        "en-US": "One bad query once dumped about 24,000 rows that included mobile numbers."
      prerequisites: []
      evidenceId: ev-pain
    - id: du-004
      topic: pain
      text:
        "zh-CN": "业务请求方会把结果直接贴进幻灯片；语义层覆盖约40%指标。"
        "en-US": "The business requester pastes results straight into slides; the semantic layer covers about 40% of metrics."
      prerequisites: ["du-003"]
      evidenceId: ev-pain
    - id: du-005
      topic: root-cause
      text:
        "zh-CN": "语义层覆盖不全，代理常裸写 JOIN。"
        "en-US": "Semantic-layer coverage is incomplete, so the agent often writes raw JOINs."
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-006
      topic: root-cause
      text:
        "zh-CN": "过滤条件会被模型丢掉；行级安全不是默认强制。"
        "en-US": "The model can drop filter predicates; row-level security is not enforced by default."
      prerequisites: ["du-005"]
      evidenceId: ev-root-cause
    - id: du-007
      topic: business-impact
      text:
        "zh-CN": "一次个人字段泄漏会触发监管通报；分析负责人仍想先让业务自助问数。"
        "en-US": "One personal-field leak triggers a regulatory notice; the analytics lead still wants the business to self-serve first."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-008
      topic: business-impact
      text:
        "zh-CN": "DBA 认为写库或宽表裸查会打穿平台；业务觉得审批太慢。"
        "en-US": "The DBA believes a write or a bare wide-table scan will punch through the platform; the business thinks approval is too slow."
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-009
      topic: constraints
      text:
        "zh-CN": "代理禁止写库；跨部门宽表必须先批准。"
        "en-US": "The agent must not write the warehouse; cross-department wide tables must be approved first."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-010
      topic: constraints
      text:
        "zh-CN": "含手机号等个人字段的结果不得带出受控环境。"
        "en-US": "Results that include mobile numbers or other personal fields must not leave the controlled environment."
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-011
      topic: success-measures
      text:
        "zh-CN": "目标：自然语言问数成为只读默认路径，业务少找分析师搬数。"
        "en-US": "Goal: natural-language asks become the read-only default path, and the business stops tapping analysts for pulls."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-012
      topic: success-measures
      text:
        "zh-CN": "质量红线：查询必须带行级安全；语义层未覆盖的指标不得裸拼 SQL。"
        "en-US": "Quality floor: every query must carry row-level security; metrics the semantic layer does not cover must not be assembled as raw SQL."
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-013
      topic: trust
      text:
        "zh-CN": "业务请求方不信语义层，想直接问宽表。"
        "en-US": "The business requester does not trust the semantic layer and wants to ask the wide table directly."
      prerequisites: []
      evidenceId: ev-trust
    - id: du-014
      topic: trust
      text:
        "zh-CN": "隐私官不信文本转 SQL 会守住过滤；分析负责人低估关联风险。"
        "en-US": "The privacy officer does not believe text-to-SQL will keep filters; the analytics lead underestimates join risk."
      prerequisites: ["du-013"]
      evidenceId: ev-trust
    - id: du-015
      topic: failure-modes
      text:
        "zh-CN": "错 JOIN 会把不该关联的用户表拼出来。"
        "en-US": "A wrong JOIN stitches in a user table that should not have been joined."
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-016
      topic: failure-modes
      text:
        "zh-CN": "漏过滤会打出含手机号的明细。"
        "en-US": "A dropped filter dumps detail rows that include mobile numbers."
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "问数代理路径（自然语言到语义层再到只读 SQL）、行级安全是否套在每条查询上、跨部门宽表如何走批准"
        "en-US": "Analysis-agent path (natural language to semantic layer to read-only SQL), whether row-level security wraps every query, and how cross-department wide tables take approval"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "问数痛点：一次失败查询打出的个人字段暴露、语义层覆盖缺口、结果被贴进幻灯片"
        "en-US": "Ask-data pain: personal-field exposure from a failed query, semantic-layer coverage gap, results pasted into slides"
      weight: 2
      disclosureUnitIds: ["du-003", "du-004"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "语义层覆盖不全导致裸写关联；过滤条件会被丢掉；行级安全不是默认强制"
        "en-US": "Incomplete semantic coverage leads to raw joins; filter predicates can be dropped; row-level security is not enforced by default"
      weight: 2
      disclosureUnitIds: ["du-005", "du-006"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：个人字段泄漏触发监管通报、分析负责人仍要先上自助问数、平台与业务对写库和宽表审批的对立"
        "en-US": "Business impact: a personal-field leak triggers a regulatory notice, the analytics lead still wants self-serve first, and platform versus business conflict on writes and wide-table approval"
      weight: 1
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：禁止写库、跨部门宽表须先批准，含个人字段的结果不得带出受控环境"
        "en-US": "Implementation constraints: no warehouse writes, approval before cross-department wide tables; results with personal fields must not leave the controlled environment"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：自然语言问数成为只读默认路径、业务少找分析师搬数、查询必须带行级安全、语义层未覆盖不得裸拼 SQL"
        "en-US": "Success metrics: natural-language asks as the read-only default path, fewer analyst pulls, every query carries row-level security, uncovered metrics must not become raw SQL"
      weight: 2
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：业务想绕过语义层问宽表，隐私官不信文本转 SQL 会守过滤，分析负责人低估关联风险"
        "en-US": "Trust issues: the business wants to bypass the semantic layer for wide tables; privacy does not trust text-to-SQL to keep filters; the analytics lead underestimates join risk"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：错误关联拼进不该出现的用户表；丢掉过滤后打出含个人字段的明细"
        "en-US": "Failure modes: a wrong association stitches in a user table that should not appear; a dropped filter dumps detail rows with personal fields"
      weight: 1
      disclosureUnitIds: ["du-015", "du-016"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "问数代理问题陈述清晰度"
              "en-US": "Analysis-Agent Problem Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述业务需要只读的自然语言问数代理，而不是迁库或开放写库"
              "en-US": "Can accurately describe why the business needs a read-only natural-language analysis agent, not a warehouse migration or open writes"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了分析负责人、平台DBA、业务请求方和隐私官及其核心关切"
              "en-US": "Has identified the analytics lead, platform DBA, business requester, and privacy officer with their core concerns"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标（只读默认路径、少找分析师、行级安全必带、未覆盖指标不得裸拼）"
              "en-US": "Are measurable success criteria (read-only default path, fewer analyst pulls, required row-level security, no raw SQL for uncovered metrics) clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖只读 SQL、语义层、行级安全、禁止写库、宽表批准与漏过滤处理"
              "en-US": "Does the solution cover read-only SQL, the semantic layer, row-level security, no writes, wide-table approval, and dropped-filter handling"
          - id: s-c2
            label:
              "zh-CN": "文本转 SQL 与语义层守门的权衡"
              "en-US": "Text-to-SQL vs. Semantic-layer Guardrail Trade-off"
            weight: 35
            description:
              "zh-CN": "方案是否清晰地权衡了自然语言生成 SQL 与必须走语义层守门"
              "en-US": "Does the solution clearly weigh free text-to-SQL against a required semantic-layer guardrail"
          - id: s-c3
            label:
              "zh-CN": "隐私与 HITL 兼容性"
              "en-US": "Privacy and HITL Compatibility"
            weight: 25
            description:
              "zh-CN": "方案是否在禁止写库与跨部门宽表须批准的限制内可行"
              "en-US": "Is the solution feasible within no warehouse writes and human approval on cross-department wide tables"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "错误关联与漏过滤应对"
              "en-US": "Wrong-join and Dropped-filter Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对错误关联或丢掉过滤打出个人字段等不安全自动化"
              "en-US": "Can effectively address unsafe automation such as a wrong join or a dropped filter that returns personal fields"
          - id: ch-c2
            label:
              "zh-CN": "写库与宽表升级应对"
              "en-US": "Write and Wide-table Escalation Response"
            weight: 50
            description:
              "zh-CN": "是否建立了禁止写库、宽表必须人工批准的升级通道"
              "en-US": "Has a reliable path been established so writes are refused and wide tables wait for human approval"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层自助与监管适配"
              "en-US": "Executive Self-serve and Regulatory Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向分析负责人的自助压力与隐私官的监管关切进行阐述，同时承认行级安全和批准会限制覆盖"
              "en-US": "Does the presentation address the analytics lead's self-serve pressure and the privacy officer's regulatory concerns while acknowledging row-level security and approval limit coverage"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "分阶段上线合理性"
              "en-US": "Phased Rollout Reasonableness"
            weight: 30
            description:
              "zh-CN": "分阶段问数代理上线（先语义层内只读查询，再批准后的宽表）是否合理、可实现"
              "en-US": "Is the phased analysis-agent rollout (read-only queries inside the semantic layer first, then approved wide tables) reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "度量体系明确性"
              "en-US": "Measurement Clarity"
            weight: 40
            description:
              "zh-CN": "查询安全、语义覆盖与业务自助的度量体系是否明确"
              "en-US": "Are query-safety, semantic-coverage, and business-self-serve metrics clearly defined"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了错误关联、漏过滤、写库尝试和结果外带等风险并制定了缓解计划"
              "en-US": "Are risks such as wrong joins, dropped filters, write attempts, and results leaving the environment identified with mitigation plans"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "分析负责人想先让业务自助问数，而隐私官要求查询必须带行级安全、禁止打出个人字段"
        "en-US": "The analytics lead wants the business to self-serve first, while the privacy officer requires every query to carry row-level security and forbids dumping personal fields"
      expectedEvidenceIds: ["ev-constraints", "ev-business-impact"]
    - id: cc-002
      statement:
        "zh-CN": "业务请求方想直接问宽表并马上贴进幻灯片，而 DBA 要求跨部门宽表必须先批准、代理不得写库"
        "en-US": "The business requester wants to ask wide tables directly and paste into slides immediately, while the DBA requires approval before cross-department wide tables and forbids warehouse writes"
      expectedEvidenceIds: ["ev-trust", "ev-workflow"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "在谈问数代理之前，业务现在是怎样从数仓拿到数的？"
          "en-US": "Before proposing the analysis agent, how does the business currently get numbers out of the warehouse?"
        "2":
          "zh-CN": "去找自然语言怎么落到 SQL、语义层和行级安全的位置，以及宽表怎么走。"
          "en-US": "Look for how natural language lands on SQL, where the semantic layer and row-level security sit, and how wide tables are reached."
        "3":
          "zh-CN": "业务用自然语言提问后，代理会按什么顺序用语义层和只读 SQL？行级安全和跨部门宽表分别怎么处理？"
          "en-US": "After a natural-language ask, in what order does the agent use the semantic layer and read-only SQL? How are row-level security and cross-department wide tables handled?"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "问数现在最疼的是取数效率、指标口径，还是数据暴露？"
          "en-US": "Is asking for data hurting most on pull speed, metric definitions, or data exposure?"
        "2":
          "zh-CN": "去找一次失败查询的暴露面、语义层覆盖范围，以及结果离开分析环境后的用法。"
          "en-US": "Look for the blast radius of a failed query, semantic-layer coverage, and what happens to results after they leave the analytics environment."
        "3":
          "zh-CN": "出错的查询曾经把什么打出来？语义层现在盖住多少指标？业务拿到结果后会怎么用？"
          "en-US": "What did a failed query once dump, how much of the metric set does the semantic layer cover today, and what does the business do with the result?"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有问数卡住的是语义层、SQL 拼装，还是安全默认值？"
          "en-US": "Is current asking stuck on the semantic layer, SQL assembly, or security defaults?"
        "2":
          "zh-CN": "去找语义层覆盖、关联怎么生成，以及过滤和行级安全是否默认生效。"
          "en-US": "Look for semantic-layer coverage, how associations are generated, and whether filters and row-level security apply by default."
        "3":
          "zh-CN": "语义层盖不住的指标，代理会怎么写查询？过滤条件和行级安全在查询里实际怎么落地？"
          "en-US": "When the semantic layer does not cover a metric, how does the agent write the query? How do filters and row-level security actually land on the statement?"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "错数和漏数，分别打在监管还是业务速度上？"
          "en-US": "Do wrong or leaked numbers hit regulation, business speed, or both?"
        "2":
          "zh-CN": "去找个人字段泄漏的组织代价，以及自助问数与平台守门之间的张力。"
          "en-US": "Look for the organizational cost of a personal-field leak and the tension between self-serve asks and platform gates."
        "3":
          "zh-CN": "一次把明细打出来会触发什么？分析负责人和平台对先上线自助问数分别怎么看？"
          "en-US": "What does dumping detail rows trigger, and how do the analytics lead and the platform each view shipping self-serve asks first?"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "写库和跨部门取数，分别被什么拦住？"
          "en-US": "What stops warehouse writes versus what stops a cross-department pull?"
        "2":
          "zh-CN": "去找禁止的写操作、宽表批准，以及个人字段能否带出受控环境。"
          "en-US": "Look for forbidden writes, wide-table approval, and whether personal fields may leave the controlled environment."
        "3":
          "zh-CN": "代理能不能写数仓？跨部门宽表要不要先批准？含个人字段的结果能不能带出受控环境？"
          "en-US": "May the agent write the warehouse, must cross-department wide tables wait for approval, and may results with personal fields leave the controlled environment?"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层用自助效率、语义覆盖还是安全红线来宣布问数代理成功？"
          "en-US": "Will leadership call this analysis agent a win on self-serve speed, semantic coverage, or the safety floor?"
        "2":
          "zh-CN": "去找默认问数路径、行级安全是否必带，以及语义层未覆盖时能不能裸写 SQL。"
          "en-US": "Look for the default ask path, whether row-level security is required, and whether uncovered metrics may become raw SQL."
        "3":
          "zh-CN": "怎样才算业务少找分析师搬数？查询必须带上什么安全控制？语义层没有的指标能不能直接拼 SQL？"
          "en-US": "What would count as the business stopping analyst pulls, which safety control must every query carry, and may uncovered metrics be assembled as raw SQL?"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "业务和隐私对同一套问数代理，分别盼什么、怕什么？"
          "en-US": "What do the business versus privacy hope or fear from the same analysis agent?"
        "2":
          "zh-CN": "去找业务是否绕过语义层，以及隐私对文本转 SQL 守过滤的预期。"
          "en-US": "Look for business workarounds around the semantic layer and privacy's expectation that text-to-SQL will keep filters."
        "3":
          "zh-CN": "业务更想问宽表还是走语义层？隐私是否相信自然语言查询会守住过滤？"
          "en-US": "Would the business rather ask a wide table or go through the semantic layer, and does privacy believe a natural-language query will keep its filters?"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "查询太宽和拼错数据粒度，哪种更可能把问数代理打穿？"
          "en-US": "Which failure punches through first: a query that is too wide, or a query that joins at the wrong grain?"
        "2":
          "zh-CN": "去找错误关联和丢失过滤时结果集的样子，以及个人字段如何出现。"
          "en-US": "Look for what the result set looks like after a wrong association or a missing filter, and how personal fields show up."
        "3":
          "zh-CN": "查询一旦关联错了，结果里会出现什么？过滤没带上时，业务会看到什么字段？"
          "en-US": "If the query associates the wrong tables, what appears in the result? If a filter never made it on, which fields does the business see?"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个包含只读 SQL、语义层、行级安全、禁止写库与宽表批准的完整方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete plan with read-only SQL, the semantic layer, row-level security, no warehouse writes, and wide-table approval"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须面向管理层展示可量化的自助收益，并化解个人字段泄漏、写库与宽表绕过等安全顾虑"
        "en-US": "In the PITCH phase, the learner must present quantifiable self-serve value to leadership and address personal-field leaks, warehouse writes, and wide-table bypass"

events:
  - id: event-privacy-mandate
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【隐私通知】隐私负责人宣布：代理一律禁止写数仓，跨部门宽表必须先经人工批准，含个人字段的结果不得带出受控环境。"
      "en-US": "【Privacy Notice】The privacy officer announces that the agent is strictly forbidden from writing the warehouse, cross-department wide tables must wait for human approval, and results with personal fields must not leave the controlled environment."
  - id: event-self-serve-pressure
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-business-impact
    prompt:
      "zh-CN": "【自助压力】分析负责人要求：问数代理必须先让业务自助问数，行级安全和宽表批准可以后补。"
      "en-US": "【Self-serve Pressure】The analytics lead requires the analysis agent to let the business self-serve first, with row-level security and wide-table approval allowed to wait."
  - id: event-pii-incident
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-failure-modes
    prompt:
      "zh-CN": "【事故报告】平台负责人通报：一次错误关联加上丢掉的过滤，把含手机号的明细打给了业务。"
      "en-US": "【Incident Report】The platform owner reports that a wrong association plus a dropped filter dumped detail rows with mobile numbers to the business."
  - id: event-readonly-required
    trigger:
      kind: after_question_count
      count: 3
    prompt:
      "zh-CN": "【流程要求】数据平台要求：每一条生成的语句都必须是只读，语义层未覆盖的指标不得裸拼，任何写库尝试都必须失败并升级。"
      "en-US": "【Process Required】The data platform requires every generated statement to be read-only, uncovered metrics must not be assembled raw, and any write attempt must fail and escalate."
