id: manufacturing-alert-triage
schemaVersion: 1
locale: zh-CN

public:
  openingRequest:
    "zh-CN": "请帮助我们设计一个基于AI的解决方案，以提升工厂的运营效率"
    "en-US": "Please help us design an AI-based solution to improve our factory's operational efficiency"
  visibleContext:
    "zh-CN": "我们是一家制造企业。我们的工厂设备会持续产生各种监控信号和告警，这些信号目前没有得到高效的处理。我们希望能引入AI技术来优化这一流程，减少运营中的低效环节，让团队把精力集中在真正重要的工作上。"
    "en-US": "We are a manufacturing company. Our factory equipment continuously produces various monitoring signals and alerts, and these signals are not currently handled efficiently. We hope to introduce AI technology to optimize this process, reduce inefficiencies in our operations, and let the team focus on the work that truly matters."
  visibleConstraints:
    - "zh-CN": "六周试点期限，且预算有限"
      "en-US": "Six-week pilot timeline with a limited budget"
    - "zh-CN": "高安全要求：所有系统必须部署在工厂内网/VPC中"
      "en-US": "High safety requirement: all systems must be deployed on-premises within the factory's VPC"
    - "zh-CN": "不能影响现有生产系统的稳定性和可用性"
      "en-US": "Must not affect the stability and availability of existing production systems"
    - "zh-CN": "需要与现有的SCADA和MES系统集成"
      "en-US": "Must integrate with existing SCADA and MES systems"
  deliverables:
    - "zh-CN": "完整的告警优化方案设计文档"
      "en-US": "Complete alert optimization design document"
    - "zh-CN": "系统架构图和数据流图"
      "en-US": "System architecture diagram and data flow diagrams"
    - "zh-CN": "风险评估和缓解措施"
      "en-US": "Risk assessment and mitigation measures"
    - "zh-CN": "实施路线图和里程碑"
      "en-US": "Implementation roadmap and milestones"
  learnerRules:
    - "zh-CN": "你只有12个问题预算来了解工厂现状"
      "en-US": "You have a budget of 12 questions to understand the factory's current situation"
    - "zh-CN": "每个问题必须指定由哪位干系人回答"
      "en-US": "Each question must specify which stakeholder will answer"
    - "zh-CN": "你需要在DISCOVERY阶段逐步发现隐藏的业务事实"
      "en-US": "You need to gradually discover hidden business facts in the DISCOVERY phase"
    - "zh-CN": "在PITCH阶段你需要向管理层展示方案并争取批准"
      "en-US": "In the PITCH phase, you must present the solution to management for approval"
  questionBudget: 12

customer:
  stakeholders:
    - id: vp-operations
      role:
        "zh-CN": "运营副总裁"
        "en-US": "VP of Operations"
      persona:
        "zh-CN": "45岁男性，广泛负责工厂运营。关注总体运营效率、生产KPI和投资回报率。倾向于使用数据驱动的决策方式，但对新技术持怀疑态度。"
        "en-US": "45-year-old male, overall responsible for factory operations. Focuses on overall operational efficiency, production KPIs, and ROI. Prefers data-driven decision-making but skeptical of new technologies."
      concerns:
        - "zh-CN": "新系统是否能够真正降低生产停机时间？"
          "en-US": "Will the new system actually reduce production downtime?"
        - "zh-CN": "AI系统的误判成本有多高？"
          "en-US": "What is the cost of AI system misjudgments?"
        - "zh-CN": "需要多大规模的变革才能成功？"
          "en-US": "How much organizational change is needed for success?"
      blindSpots:
        - "zh-CN": "不了解工程师对AI的技术信任问题"
          "en-US": "Does not understand engineers' trust issues with AI technology"
        - "zh-CN": "低估了与现有系统的集成复杂度"
          "en-US": "Underestimates integration complexity with existing systems"
        - "zh-CN": "不知道当前人工处理流程的瓶颈"
          "en-US": "Does not know the bottlenecks in current manual handling process"
    - id: project-manager
      role:
        "zh-CN": "项目经理"
        "en-US": "Project Manager"
      persona:
        "zh-CN": "35岁女性，负责多个工厂改进项目。精通项目管理，关注时间表、预算和资源分配。"
        "en-US": "35-year-old female, responsible for multiple factory improvement projects. Proficient in project management, focuses on timelines, budgets, and resource allocation."
      concerns:
        - "zh-CN": "项目能否在六周内完成并证明价值？"
          "en-US": "Can the project be completed and demonstrate value within six weeks?"
        - "zh-CN": "是否需要额外的开发资源？"
          "en-US": "Are additional development resources required?"
        - "zh-CN": "如果试点失败，如何向高层解释？"
          "en-US": "How to explain to senior management if the pilot fails?"
      blindSpots:
        - "zh-CN": "不了解技术实施的具体挑战"
          "en-US": "Does not understand technical implementation challenges"
        - "zh-CN": "不知道告警数据的质量问题"
          "en-US": "Does not know about alert data quality issues"
        - "zh-CN": "错误假设AI是唯一解决方案"
          "en-US": "Incorrectly assumes AI is the only solution"
    - id: technical-lead
      role:
        "zh-CN": "技术负责人"
        "en-US": "Technical Lead"
      persona:
        "zh-CN": "40岁男性，负责工厂IT系统维护。有多年工业自动化经验，对现有系统了如指掌。"
        "en-US": "40-year-old male, responsible for factory IT system maintenance. Many years of industrial automation experience, deeply familiar with existing systems."
      concerns:
        - "zh-CN": "新系统如何与现有SCADA系统集成？"
          "en-US": "How will the new system integrate with existing SCADA systems?"
        - "zh-CN": "数据采集频率和延迟要求是什么？"
          "en-US": "What are the data collection frequency and latency requirements?"
        - "zh-CN": "是否有现有的自动化规则可以复用？"
          "en-US": "Can existing automation rules be reused?"
      blindSpots:
        - "zh-CN": "过于关注技术细节而忽视业务价值"
          "en-US": "Over-focuses on technical details while ignoring business value"
        - "zh-CN": "不清楚不同部门对AI的接受程度"
          "en-US": "Does not understand different departments' acceptance of AI"
        - "zh-CN": "低估了用户培训和变更管理需求"
          "en-US": "Underestimates user training and change management needs"
  disclosureUnits:
    - id: du-001
      topic: workflow
      text:
        "zh-CN": "工厂每天产生约12,000条设备告警，其中大约80%是低价值的误报或已知问题"
        "en-US": "The factory generates approximately 12,000 equipment alerts daily, with about 80% being low-value false positives or known issues"
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-002
      topic: workflow
      text:
        "zh-CN": "工程师平均每天需要手动处理约2,400条需要关注的告警（剩余20%）"
        "en-US": "Engineers manually handle approximately 2,400 alerts requiring attention daily (the remaining 20%)"
      prerequisites: ["du-001"]
      evidenceId: ev-workflow
    - id: du-003
      topic: workflow
      text:
        "zh-CN": "当前告警处理流程缺乏优先级排序，所有告警被视为同等重要"
        "en-US": "The current alert handling process lacks prioritization; all alerts are treated as equally important"
      prerequisites: []
      evidenceId: ev-workflow
    - id: du-004
      topic: pain
      text:
        "zh-CN": "工程师花费约40%的工作时间在低价值告警上，导致真正问题响应延迟"
        "en-US": "Engineers spend approximately 40% of their working time on low-value alerts, causing delays in responding to genuine issues"
      prerequisites: ["du-001"]
      evidenceId: ev-pain
    - id: du-005
      topic: pain
      text:
        "zh-CN": "2023年因告警响应延迟导致的生产停机损失约为200万美元"
        "en-US": "Production downtime losses due to alert response delays amounted to approximately $2 million in 2023"
      prerequisites: []
      evidenceId: ev-pain
    - id: du-006
      topic: pain
      text:
        "zh-CN": "工程师平均响应一个告警需要5-10分钟，期间无法处理其他任务"
        "en-US": "Engineers take an average of 5-10 minutes to respond to one alert, during which they cannot handle other tasks"
      prerequisites: []
      evidenceId: ev-pain
    - id: du-007
      topic: root-cause
      text:
        "zh-CN": "当前使用的规则系统是5年前开发的，无法适应新型设备和工艺变化"
        "en-US": "The current rule-based system was developed 5 years ago and cannot adapt to new equipment and process changes"
      prerequisites: []
      evidenceId: ev-root-cause
    - id: du-008
      topic: root-cause
      text:
        "zh-CN": "75%的误报是由于规则系统无法识别工艺参数的正常波动范围"
        "en-US": "75% of false positives are due to the rule system's inability to recognize normal process parameter fluctuations"
      prerequisites: ["du-007"]
      evidenceId: ev-root-cause
    - id: du-009
      topic: business-impact
      text:
        "zh-CN": "当前的告警处理方式每年导致约15%的设备预防性维护被推迟或取消"
        "en-US": "The current alert handling approach causes approximately 15% of equipment preventive maintenance to be postponed or canceled annually"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-010
      topic: business-impact
      text:
        "zh-CN": "由于告警疲劳，工程师在夜间班次中漏报率高达30%"
        "en-US": "Due to alert fatigue, engineers have a 30% missed alert rate during night shifts"
      prerequisites: []
      evidenceId: ev-business-impact
    - id: du-011
      topic: constraints
      text:
        "zh-CN": "工厂网络是隔离的VPC环境，不允许外部云服务直接访问"
        "en-US": "The factory network is an isolated VPC environment that does not allow direct external cloud service access"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-012
      topic: constraints
      text:
        "zh-CN": "预算限制导致我们无法聘请外部AI专家进行定制化开发"
        "en-US": "Budget constraints prevent us from hiring external AI experts for custom development"
      prerequisites: []
      evidenceId: ev-constraints
    - id: du-013
      topic: success-measures
      text:
        "zh-CN": "管理层希望将工程师管理的告警数量降低50%，即每天只需处理约1,200条"
        "en-US": "Management hopes to reduce the number of alerts engineers manage by 50%, meaning handling approximately 1,200 alerts per day"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-014
      topic: success-measures
      text:
        "zh-CN": "关键目标是将生产停机时间减少30%，预计每年可节省300万美元"
        "en-US": "The key goal is to reduce production downtime by 30%, estimated to save $3 million annually"
      prerequisites: []
      evidenceId: ev-success-measures
    - id: du-015
      topic: trust
      text:
        "zh-CN": "一线工程师对AI系统持怀疑态度，认为AI无法理解复杂设备行为"
        "en-US": "Frontline engineers are skeptical of AI systems, believing AI cannot understand complex equipment behavior"
      prerequisites: []
      evidenceId: ev-trust
    - id: du-016
      topic: trust
      text:
        "zh-CN": "工程师担心AI系统会产生'黑箱'决策，无法解释为什么某些告警被标记为高优先级"
        "en-US": "Engineers fear AI systems will produce 'black box' decisions without explaining why certain alerts are marked high priority"
      prerequisites: []
      evidenceId: ev-trust
    - id: du-017
      topic: failure-modes
      text:
        "zh-CN": "如果AI系统误报率过高，工程师可能会忽略所有告警，导致安全风险"
        "en-US": "If the AI system's false positive rate is too high, engineers may ignore all alerts, creating safety risks"
      prerequisites: []
      evidenceId: ev-failure-modes
    - id: du-018
      topic: failure-modes
      text:
        "zh-CN": "系统如果在夜间自动抑制告警，可能导致紧急问题无法及时处理"
        "en-US": "If the system automatically suppresses alerts at night, critical issues may not be addressed promptly"
      prerequisites: []
      evidenceId: ev-failure-modes
  responsePolicies: []
  privateConflicts: []

evaluator:
  expectedEvidence:
    - id: ev-workflow
      category: workflow
      description:
        "zh-CN": "告警处理流程的信息：当前流程、处理量、瓶颈"
        "en-US": "Information about alert handling workflow: current process, volume, bottlenecks"
      weight: 2
      disclosureUnitIds: ["du-001", "du-002", "du-003"]
    - id: ev-pain
      category: pain
      description:
        "zh-CN": "告警问题带来的业务痛点：时间浪费、停机损失、响应延迟"
        "en-US": "Business pain points from alerts: time waste, downtime losses, response delays"
      weight: 2
      disclosureUnitIds: ["du-004", "du-005", "du-006"]
    - id: ev-root-cause
      category: root-cause
      description:
        "zh-CN": "当前系统失败的根本原因：规则系统过时、无法适应变化"
        "en-US": "Root causes of current system failure: outdated rule system, unable to adapt to changes"
      weight: 2
      disclosureUnitIds: ["du-007", "du-008"]
    - id: ev-business-impact
      category: business-impact
      description:
        "zh-CN": "业务影响：维护推迟、漏报率、财务损失"
        "en-US": "Business impact: maintenance delays, missed alert rates, financial losses"
      weight: 1
      disclosureUnitIds: ["du-009", "du-010"]
    - id: ev-constraints
      category: constraints
      description:
        "zh-CN": "实施限制：网络隔离、预算限制、集成要求"
        "en-US": "Implementation constraints: network isolation, budget limits, integration requirements"
      weight: 1
      disclosureUnitIds: ["du-011", "du-012"]
    - id: ev-success-measures
      category: success-measures
      description:
        "zh-CN": "成功指标：降低处理量、减少停机、节省成本"
        "en-US": "Success metrics: reduce handling volume, reduce downtime, save costs"
      weight: 2
      disclosureUnitIds: ["du-013", "du-014"]
    - id: ev-trust
      category: trust
      description:
        "zh-CN": "信任问题：工程师对AI的怀疑、需要可解释性"
        "en-US": "Trust issues: engineer skepticism toward AI, need for explainability"
      weight: 2
      disclosureUnitIds: ["du-015", "du-016"]
    - id: ev-failure-modes
      category: failure-modes
      description:
        "zh-CN": "失败模式：误报导致忽略告警、安全风险"
        "en-US": "Failure modes: false positives leading to alert ignoring, safety risks"
      weight: 1
      disclosureUnitIds: ["du-017", "du-018"]
  rubric:
    stages:
      - id: framing
        label:
          "zh-CN": "问题定义"
          "en-US": "Problem Framing"
        criteria:
          - id: f-c1
            label:
              "zh-CN": "问题陈述清晰度"
              "en-US": "Problem Statement Clarity"
            weight: 30
            description:
              "zh-CN": "能否准确描述当前告警系统的问题和业务影响"
              "en-US": "Can accurately describe the current alert system problem and business impact"
          - id: f-c2
            label:
              "zh-CN": "关键利益相关者识别"
              "en-US": "Key Stakeholder Identification"
            weight: 25
            description:
              "zh-CN": "是否识别了所有关键干系人及其核心关切"
              "en-US": "Has all key stakeholders and their core concerns been identified"
          - id: f-c3
            label:
              "zh-CN": "成功标准明确性"
              "en-US": "Success Criteria Clarity"
            weight: 45
            description:
              "zh-CN": "是否明确定义了可衡量的成功指标"
              "en-US": "Are measurable success criteria clearly defined"
      - id: solution
        label:
          "zh-CN": "方案设计"
          "en-US": "Solution Design"
        criteria:
          - id: s-c1
            label:
              "zh-CN": "方案完整性"
              "en-US": "Solution Completeness"
            weight: 40
            description:
              "zh-CN": "方案是否覆盖了数据收集、处理、决策、反馈的完整流程"
              "en-US": "Does the solution cover the complete process of data collection, processing, decision-making, and feedback"
          - id: s-c2
            label:
              "zh-CN": "与约束的兼容性"
              "en-US": "Constraint Compatibility"
            weight: 35
            description:
              "zh-CN": "方案是否在 budget、VPC、时间限制内可行"
              "en-US": "Is the solution feasible within budget, VPC, and time constraints"
          - id: s-c3
            label:
              "zh-CN": "可实施性"
              "en-US": "Implementability"
            weight: 25
            description:
              "zh-CN": "方案是否考虑了与现有系统的集成和工程师的接受度"
              "en-US": "Does the solution consider integration with existing systems and engineer acceptance"
      - id: challenge
        label:
          "zh-CN": "挑战应对"
          "en-US": "Challenge Response"
        criteria:
          - id: ch-c1
            label:
              "zh-CN": "信任挑战应对"
              "en-US": "Trust Challenge Response"
            weight: 50
            description:
              "zh-CN": "能否有效应对工程师对AI的怀疑和恐惧"
              "en-US": "Can effectively address engineer skepticism and fears about AI"
          - id: ch-c2
            label:
              "zh-CN": "技术风险缓解"
              "en-US": "Technical Risk Mitigation"
            weight: 50
            description:
              "zh-CN": "是否提出了降低误报率和确保系统可靠性的措施"
              "en-US": "Are measures proposed to reduce false positive rates and ensure system reliability"
      - id: pitch
        label:
          "zh-CN": "方案表达"
          "en-US": "Solution Presentation"
        criteria:
          - id: p-c1
            label:
              "zh-CN": "高层信息适配"
              "en-US": "Senior Leadership Adaptation"
            weight: 40
            description:
              "zh-CN": "是否面向管理层关注的业务价值和投资回报进行阐述"
              "en-US": "Does the presentation focus on business value and ROI for senior leadership"
          - id: p-c2
            label:
              "zh-CN": "清晰度和说服力"
              "en-US": "Clarity and Persuasiveness"
            weight: 60
            description:
              "zh-CN": "方案表达是否清晰、有说服力、行动导向"
              "en-US": "Is the solution presentation clear, persuasive, and action-oriented"
      - id: process
        label:
          "zh-CN": "实施流程"
          "en-US": "Implementation Process"
        criteria:
          - id: pr-c1
            label:
              "zh-CN": "时间规划合理性"
              "en-US": "Timeline Reasonableness"
            weight: 30
            description:
              "zh-CN": "六周Pilot计划是否合理、可实现"
              "en-US": "Is the six-week pilot plan reasonable and achievable"
          - id: pr-c2
            label:
              "zh-CN": "可交付成果明确性"
              "en-US": "Deliverable Clarity"
            weight: 40
            description:
              "zh-CN": "每个阶段的可交付成果是否明确、可验收"
              "en-US": "Are deliverables for each phase clearly defined and acceptability criteria"
          - id: pr-c3
            label:
              "zh-CN": "风险管理"
              "en-US": "Risk Management"
            weight: 30
            description:
              "zh-CN": "是否识别了关键风险并制定了缓解计划"
              "en-US": "Are key risks identified and mitigation plans established"
  criticalContradictions:
    - id: cc-001
      statement:
        "zh-CN": "管理层希望实现广泛的自动化决策，而一线工程师强烈怀疑AI系统能否理解复杂的设备行为"
        "en-US": "Management wants broad automated decision-making, while frontline engineers strongly doubt whether AI systems can understand complex equipment behavior"
      expectedEvidenceIds: ["ev-trust", "ev-workflow"]
  hintLadders:
    - id: hl-workflow
      topic: workflow
      hints:
        "1":
          "zh-CN": "思考当前告警处理的起点：谁收到告警？他们如何处理？"
          "en-US": "Think about the starting point of current alert handling: who receives alerts? How do they handle them?"
        "2":
          "zh-CN": "关注数据量：每天有多少告警？其中多少是真正需要关注的？"
          "en-US": "Focus on data volume: how many alerts per day? How many truly require attention?"
        "3":
          "zh-CN": "关键发现：80%的告警是低价值的，工程师花了太多时间在误报上"
          "en-US": "Key discovery: 80% of alerts are low-value; engineers spend too much time on false positives"
    - id: hl-pain
      topic: pain
      hints:
        "1":
          "zh-CN": "考虑工程师的时间分配：他们花多少时间在告警上？"
          "en-US": "Consider engineer time allocation: how much time do they spend on alerts?"
        "2":
          "zh-CN": "思考时间浪费的后果：响应延迟如何影响生产？"
          "en-US": "Consider the consequences of time waste: how does delayed response affect production?"
        "3":
          "zh-CN": "关键发现：每天浪费40%时间，导致200万美元的年度停机损失"
          "en-US": "Key discovery: 40% of time wasted daily, leading to $2 million annual downtime losses"
    - id: hl-root-cause
      topic: root-cause
      hints:
        "1":
          "zh-CN": "现有解决方案是什么？它是如何工作的？"
          "en-US": "What is the current solution? How does it work?"
        "2":
          "zh-CN": "规则系统几年没更新了？它无法适应哪些变化？"
          "en-US": "How many years since the rule system was last updated? What changes can't it adapt to?"
        "3":
          "zh-CN": "关键发现：5年前开发的规则系统无法识别工艺参数波动"
          "en-US": "Key discovery: 5-year-old rule system cannot recognize process parameter fluctuations"
    - id: hl-trust
      topic: trust
      hints:
        "1":
          "zh-CN": "一线工程师对AI的态度是支持还是反对？为什么？"
          "en-US": "Are frontline engineers supportive or opposed to AI? Why?"
        "2":
          "zh-CN": "工程师担心AI系统的哪些具体问题？"
          "en-US": "What specific concerns do engineers have about AI systems?"
        "3":
          "zh-CN": "关键发现：85%工程师担心'黑箱'决策，需要可解释性机制"
          "en-US": "Key discovery: 85% of engineers worry about 'black box' decisions and need explainability mechanisms"
    - id: hl-constraints
      topic: constraints
      hints:
        "1":
          "zh-CN": "工厂的网络环境有什么特殊要求？"
          "en-US": "What special requirements does the factory's network environment have?"
        "2":
          "zh-CN": "预算限制对方案选择有什么影响？"
          "en-US": "How does the budget limit affect solution choices?"
        "3":
          "zh-CN": "关键发现：必须是本地部署方案，无法使用外部AI专家"
          "en-US": "Key discovery: must be on-premises solution, cannot use external AI experts"
    - id: hl-success
      topic: success-measures
      hints:
        "1":
          "zh-CN": "管理层希望达到什么具体指标？"
          "en-US": "What specific metrics does management hope to achieve?"
        "2":
          "zh-CN": "降低告警处理量50%意味着每天处理多少条？"
          "en-US": "What does reducing alert handling by 50% mean for daily volume?"
        "3":
          "zh-CN": "关键发现：2000 -> 1000条/天，三年可节省300万美元"
          "en-US": "Key discovery: 2000 -> 1000 alerts/day, saving $3 million over three years"
    - id: hl-business-impact
      topic: business-impact
      hints:
        "1":
          "zh-CN": "告警处理效率低下对业务造成了哪些具体影响？"
          "en-US": "What specific business impacts result from the inefficient alert handling?"
        "2":
          "zh-CN": "这些影响如何体现在维护安排和排班中？"
          "en-US": "How do these impacts show up in maintenance scheduling and shift planning?"
        "3":
          "zh-CN": "关键发现：约15%的预防性维护被推迟，夜间漏报率高达30%"
          "en-US": "Key discovery: about 15% of preventive maintenance is postponed, and the night-shift missed-alert rate reaches 30%"
    - id: hl-failure-modes
      topic: failure-modes
      hints:
        "1":
          "zh-CN": "如果AI方案出了问题，最坏情况是什么？"
          "en-US": "If the AI solution goes wrong, what is the worst case?"
        "2":
          "zh-CN": "误报或自动抑制告警可能带来哪些安全风险？"
          "en-US": "What safety risks could false positives or automatic alert suppression introduce?"
        "3":
          "zh-CN": "关键发现：高误报率会让工程师忽略所有告警，夜间自动抑制可能掩盖紧急问题"
          "en-US": "Key discovery: a high false-positive rate could make engineers ignore all alerts, and automatic night suppression could mask urgent issues"
  passGates:
    - id: pg-001
      description:
        "zh-CN": "在SOLUTION阶段，学员必须展示一个完整的、与约束兼容的方案"
        "en-US": "In the SOLUTION phase, the learner must demonstrate a complete, constraint-compatible solution"
    - id: pg-002
      description:
        "zh-CN": "在PITCH阶段，学员必须成功应对信任挑战并展示方案价值"
        "en-US": "In the PITCH phase, the learner must successfully address trust challenges and demonstrate solution value"

events:
  - id: event-security-restriction
    trigger:
      kind: on_stage_enter
      phase: DISCOVERY
    prompt:
      "zh-CN": "【重要通知】系统管理员通知：由于网络安全政策，所有外部云服务访问已被禁用。新系统必须完全部署在工厂内网。"
      "en-US": "【Important Notice】System Administrator: Due to network security policy, all external cloud service access has been disabled. The new system must be deployed entirely within the factory's internal network."
  - id: event-budget-cut
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-pain
    prompt:
      "zh-CN": "【预算更新】财务总监通知：由于公司整体预算调整，本项目预算被削减70%。我们需要用更少的资源实现目标。"
      "en-US": "【Budget Update】CFO: Due to company-wide budget adjustments, this project's budget has been reduced by 70%. We need to achieve targets with fewer resources."
  - id: event-accuracy-demand
    trigger:
      kind: after_evidence_revealed
      evidenceId: ev-trust
    prompt:
      "zh-CN": "【质量要求】质量总监要求：AI系统的判读准确率必须达到99%以上，否则无法通过验收"
      "en-US": "【Quality Requirement】Quality Director: The AI system's classification accuracy must reach 99% or above, otherwise it will not pass acceptance"
